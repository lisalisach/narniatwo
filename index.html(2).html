splay: swap;\n  src: local('Arial'), local('Helvetica'), local('Helvetica Neue');\n}\n\n\n:root {\n  /* ---------- Brand primary: Capital Red ---------- */\n  --capital-red: #831011;\n  --deep-red:    #4A090A;\n  --red-500:     #AD2A2B;\n  --red-300:     #C85657;\n  --red-200:     #F7C9C9;\n  --red-100:     #FAF0F0;\n\n  /* ---------- Neutrals ---------- */\n  --white: #FFFFFF;\n  --black: #000000;\n\n  /* ---------- Brand beige (default surface) ---------- */\n  --beige:     #F5F2E6;\n  --beige-400: #E4DFC8;\n  --beige-300: #EFECDD;\n  --beige-100: #FCFAF0;\n  --beige-50:  #FFFDF6;\n\n  /* ---------- Purple (section dividers) ---------- */\n  --purple:      #403050;\n  --deep-purple: #2D1F3B;\n  --purple-300:  #746188;\n  --purple-200:  #B1A2C1;\n  --purple-100:  #F7F2FD;\n\n  /* ---------- Green (feature / KPI) ---------- */\n  --green:      #044049;\n  --deep-green: #033138;\n  --green-300:  #458C88;\n  --green-200:  #BAE0D6;\n  --green-100:  #F0F8F6;\n\n  /* ---------- Chart accents (official order, VI p37) ---------- */\n  --sky-blue:  #9FDAFF;\n  --moss:      #828010;\n  --orange:    #C66A37;\n  --deep-blue: #105782;\n  --peach:     #F7C9C9;\n  --matcha:    #ACC79B;\n\n  /* ---------- Grey scale ---------- */\n  --grey-800: #4C4F56;\n  --grey-400: #ADB2BA;\n  --grey-300: #C8CBD1;\n  --grey-200: #DCDFE5;\n  --grey-100: #EEF0F4;\n  --grey-50:  #FAFBFE;\n\n  /* ---------- Semantic (light / beige backgrounds) ---------- */\n  --bg:          var(--beige);\n  --bg-alt:      var(--beige-300);\n  --bg-subtle:   var(--beige-100);\n  --surface:     var(--white);\n  --fg:          var(--black);\n  --fg-2:        var(--grey-800);\n  --fg-muted:    var(--grey-400);\n  --border:      var(--grey-200);\n  --border-soft: var(--grey-100);\n  --accent:      var(--capital-red);\n  --accent-fg:   var(--white);\n  --link:        var(--capital-red);\n\n  /* ---------- Fonts ----------\n     PPEiko 300 → display headlines, stats, pull quotes\n     PPRadioGrotesk 700 uppercase → labels/eyebrows (also 400 for lowercase UI)\n     Arial 400 → body text, tables, captions\n     F37Hooj 600 → alternate display face for editorial / marketing surfaces */\n  --font-display: 'PPEiko', Georgia, serif;\n  --font-label:   'PPRadioGrotesk', Arial, sans-serif;\n  --font-body:    'Arial', Helvetica, sans-serif;\n  --font-brand:   'F37Hooj', 'PPEiko', Georgia, serif;\n\n  /* ---------- Spacing scale ---------- */\n  --s-1: 4px;\n  --s-2: 8px;\n  --s-3: 12px;\n  --s-4: 16px;\n  --s-5: 24px;\n  --s-6: 32px;\n  --s-7: 48px;\n  --s-8: 64px;\n  --s-9: 96px;\n\n  /* ---------- Radii (Cape is conservative — radii are small) ---------- */\n  --radius-sm: 2px;\n  --radius-md: 3px;\n  --radius-lg: 6px;\n  --radius-pill: 999px;\n\n  /* ---------- Shadow system (used sparingly) ---------- */\n  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);\n  --shadow-md: 0 2px 12px rgba(0,0,0,0.08);\n  --shadow-lg: 0 8px 32px rgba(0,0,0,0.10);\n\n  /* ---------- Motion ---------- */\n  --ease:        cubic-bezier(.2,.7,.2,1);\n  --duration-1:  120ms;\n  --duration-2:  200ms;\n  --duration-3:  300ms;\n}\n\n/* ============================================================\n   Dark themes — semantic tokens flip for dark-red / -purple / -green\n   ============================================================ */\n.theme-dark-red {\n  --bg: var(--deep-red);    --bg-alt: #5e1416;  --surface: rgba(255,255,255,0.05);\n  --fg: var(--white);       --fg-2: rgba(255,255,255,0.78); --fg-muted: rgba(255,255,255,0.55);\n  --border: rgba(255,255,255,0.14); --border-soft: rgba(255,255,255,0.08);\n  --accent: var(--white);   --accent-fg: var(--deep-red);\n}\n.theme-dark-purple {\n  --bg: var(--purple);      --bg-alt: var(--deep-purple); --surface: rgba(255,255,255,0.05);\n  --fg: var(--white);       --fg-2: rgba(255,255,255,0.78); --fg-muted: rgba(255,255,255,0.55);\n  --border: rgba(255,255,255,0.14); --border-soft: rgba(255,255,255,0.08);\n  --accent: var(--white);   --accent-fg: var(--purple);\n}\n.theme-dark-green {\n  --bg: var(--green);       --bg-alt: var(--deep-green); --surface: rgba(255,255,255,0.05);\n  --fg: var(--white);       --fg-2: rgba(255,255,255,0.78); --fg-muted: rgba(255,255,255,0.55);\n  --border: rgba(255,255,255,0.14); --border-soft: rgba(255,255,255,0.08);\n  --accent: var(--white);   --accent-fg: var(--green);\n}\n\n/* ============================================================\n   Base type\n   ============================================================ */\nhtml { font-size: 16px; }\nbody {\n  font-family: var(--font-body);\n  color: var(--fg);\n  background: var(--bg);\n  line-height: 1.55;\n  -webkit-font-smoothing: antialiased;\n}\n\n/* Display headlines — PPEiko 300 */\n.headline-xl, h1.display {\n  font-family: var(--font-display);\n  font-weight: 300;\n  font-size: clamp(3rem, 6.5vw, 4.8rem);\n  letter-spacing: -0.03em;\n  line-height: 1.02;\n  color: var(--fg);\n}\n.headline, h1, h2.display {\n  font-family: var(--font-display);\n  font-weight: 300;\n  font-size: clamp(1.8rem, 4vw, 3.2rem);\n  letter-spacing: -0.02em;\n  line-height: 1.08;\n  color: var(--fg);\n}\nh2 {\n  font-family: var(--font-display);\n  font-weight: 300;\n  font-size: clamp(1.4rem, 2.6vw, 2.2rem);\n  letter-spacing: -0.015em;\n  line-height: 1.15;\n}\nh3 {\n  font-family: var(--font-display);\n  font-weight: 300;\n  font-size: 1.4rem;\n  letter-spacing: -0.01em;\n  line-height: 1.22;\n}\n\n/* Labels / eyebrows — PPRadioGrotesk 700 uppercase */\n.label, .eyebrow {\n  font-family: var(--font-label);\n  font-weight: 700;\n  font-size: 0.65rem;\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  color: var(--fg-2);\n}\n.stat-label {\n  font-family: var(--font-label);\n  font-weight: 700;\n  font-size: 0.55rem;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--fg-2);\n}\n\n/* Subtitle — Arial, NOT italic */\n.subtitle {\n  font-family: var(--font-body);\n  font-weight: 400;\n  font-size: clamp(1rem, 2vw, 1.4rem);\n  line-height: 1.4;\n  color: var(--fg-2);\n}\n\n/* Body */\np, .body-text {\n  font-family: var(--font-body);\n  font-size: 0.85rem;\n  line-height: 1.62;\n  color: var(--fg);\n}\n.body-text-lg {\n  font-family: var(--font-body);\n  font-size: 1rem;\n  line-height: 1.65;\n}\n\n/* Stats */\n.stat {\n  font-family: var(--font-display);\n  font-weight: 300;\n  font-size: clamp(2.5rem, 6vw, 5rem);\n  letter-spacing: -0.02em;\n  line-height: 1;\n}\n\n/* Pull quote — PPEiko italic */\n.quote, blockquote {\n  font-family: var(--font-display);\n  font-weight: 300;\n  font-style: italic;\n  font-size: clamp(1.6rem, 3.5vw, 2.8rem);\n  line-height: 1.3;\n  color: var(--fg);\n}\n\n/* Source / citation — 30% opacity floor */\n.cite, cite {\n  font-family: var(--font-body);\n  font-size: 0.62rem;\n  opacity: 0.3;\n  font-style: normal;\n}\n\n/* Italic emphasis inside headlines — PPEiko italic, do NOT resize or recolor */\n.headline em, .headline-xl em, h1 em, h2 em {\n  font-style: italic;\n  font-weight: 300;\n  font-size: inherit;\n  color: inherit;\n}\n\n/* Short red horizontal rule — section marker */\n.rule-red {\n  display: block;\n  width: 40px;\n  height: 2px;\n  background: var(--capital-red);\n  margin-bottom: 1rem;\n  border: 0;\n}\n<\u002Fstyle>\n<style>/* Cape Capital — brand fonts\n   Official OTF/WOFF2 files shipped alongside.\n\n   Family map:\n     • PPEiko       — display headlines, stats, pull quotes (Light 300 + italic)\n     • PPRadioGrotesk — labels/eyebrows uppercase (Bold 700) and lowercase UI (Regular 400)\n     • F37Hooj      — alternate display / editorial face (Demi 600)\n     • Arial        — body text (shipped as woff2 for offline parity)\n*/\n\n/* ---------- PP Eiko ---------- */\n@font-face {\n  font-family: 'PPEiko';\n  font-weight: 300;\n  font-style: normal;\n  font-display: swap;\n  src: url(\"5a40fa6d-cdc5-42a7-bf3d-25d3c16b9207\") format('opentype');\n}\n@font-face {\n  font-family: 'PPEiko';\n  font-weight: 300;\n  font-style: italic;\n  font-display: swap;\n  src: url(\"6fbedad1-dd76-4a50-bcef-fe72843b96bd\") format('opentype');\n}\n\n/* ---------- PP Radio Grotesk ---------- */\n@font-face {\n  font-family: 'PPRadioGrotesk';\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n  src: url(\"cb0cb904-c529-4903-aaf3-e9f234553b6a\") format('opentype');\n}\n@font-face {\n  font-family: 'PPRadioGrotesk';\n  font-weight: 700;\n  font-style: normal;\n  font-display: swap;\n  src: url(\"e76eb448-84c4-478b-9005-17fa90bcb99e\") format('opentype');\n}\n\n/* ---------- F37 Hooj (not shipped; falls back to display face) ---------- */\n\n/* ---------- Arial (system font) ---------- */\n@font-face {\n  font-family: 'Arial';\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n  src: local('Arial'), local('Helvetica'), local('Helvetica Neue');\n}\n<\u002Fstyle>\n<script src=\"42d5da30-fb34-44df-84c6-aa5582da3082\"><\u002Fscript>\n<style>\n  html, body { margin: 0; padding: 0; background: #FAFBFE; }\n  a { color: var(--capital-red); text-decoration: none; }\n  a:hover { color: var(--red-500); }\n  @keyframes rvUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }\n  @keyframes rvIn { from { opacity: 0; } to { opacity: 1; } }\n  @keyframes rvGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }\n  @keyframes rvRise { from { transform: scaleY(0); } to { transform: scaleY(1); } }\n  @keyframes rvLine { from { stroke-dashoffset: 2600; } to { stroke-dashoffset: 0; } }\n  @keyframes rvGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(131,16,17,0); } 50% { box-shadow: 0 0 0 5px rgba(131,16,17,0.13); } }\n  [data-rv-bar] { transform-origin: left center; transform-box: fill-box; }\n  [data-rv-col] { transform-origin: bottom center; transform-box: fill-box; }\n  .rv-armed [data-rv] { opacity: 0; }\n  .rv-armed [data-rv-bar] { transform: scaleX(0); }\n  .rv-armed [data-rv-col] { transform: scaleY(0); }\n  .rv-armed [data-rv-line] { stroke-dasharray: 2600; stroke-dashoffset: 2600; }\n  .is-live [data-rv] { animation: rvUp .55s ease both; }\n  .is-live [data-rv=\"fade\"] { animation: rvIn .6s ease both; }\n  .is-live [data-rv-bar] { animation: rvGrow .85s cubic-bezier(.22,.61,.36,1) both; }\n  .is-live [data-rv-col] { animation: rvRise .8s cubic-bezier(.22,.61,.36,1) both; }\n  .is-live [data-rv-line] { animation: rvLine 1.4s ease both; }\n  .is-live [data-rv-glow] { animation: rvGlow 3s ease-in-out 1.1s infinite; }\n  .is-live [data-rv][data-rv-glow] { animation: rvUp .55s ease both, rvGlow 3s ease-in-out 1.1s infinite; }\n  .no-anim [data-rv], .no-anim [data-rv-bar], .no-anim [data-rv-col], .no-anim [data-rv-line] {\n    opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important; animation: none !important;\n  }\n  .no-cites [data-cite] { display: none; }\n  /* Reveal-on-hover: key word visible, detail on request.\n     Restrained per brand - 200ms fade + 4px rise, no scale or bounce. */\n  .rv {\n    position: relative; display: inline;\n    color: var(--capital-red); cursor: help;\n    box-shadow: inset 0 -0.46em 0 #F6F2E4;\n    transition: box-shadow .22s ease;\n  }\n  .rv::after {\n    content: attr(data-n);\n    position: relative; top: -0.42em;\n    display: inline-block; line-height: 0;\n    font-family: var(--font-label); font-size: 0.42em; font-style: normal;\n    letter-spacing: 0.08em; margin-left: 0.22em;\n    color: var(--red-300); opacity: 0.85;\n  }\n  .rv:hover, .rv:focus-visible, .rv.lit { box-shadow: inset 0 -1.05em 0 #EFEBD9; outline: none; }\n  [style*=\"deep-red\"] .rv, [style*=\"rgb(74, 9, 10)\"] .rv { color: #fff; box-shadow: inset 0 -0.46em 0 rgba(255,255,255,0.16); }\n  [style*=\"deep-red\"] .rv:hover, [style*=\"deep-red\"] .rv.lit,\n  [style*=\"rgb(74, 9, 10)\"] .rv:hover, [style*=\"rgb(74, 9, 10)\"] .rv.lit { box-shadow: inset 0 -1.05em 0 rgba(255,255,255,0.24); }\n  [style*=\"deep-red\"] .rv::after, [style*=\"rgb(74, 9, 10)\"] .rv::after { color: #fff; opacity: 0.7; }\n  [style*=\"beige-100\"] .rv, [style*=\"rgb(252, 250, 240)\"] .rv { box-shadow: inset 0 -0.46em 0 #F1EDDC; }\n  [style*=\"beige-100\"] .rv:hover, [style*=\"beige-100\"] .rv.lit { box-shadow: inset 0 -1.05em 0 #EAE5D2; }\n  .rv-card {\n    position: absolute; left: 0; top: calc(100% + 12px);\n    width: 330px; box-sizing: border-box;\n    background: #fff; border: 1px solid var(--grey-200); border-top: 2px solid var(--capital-red);\n    padding: 14px 18px 16px;\n    font-family: Arial, sans-serif; font-size: 15px; line-height: 1.5; font-weight: 400; font-style: normal;\n    color: var(--grey-800); text-align: left; text-transform: none; letter-spacing: 0;\n    white-space: normal; overflow-wrap: break-word; word-break: normal; text-wrap: pretty;\n    box-shadow: 0 2px 12px rgba(0,0,0,0.08);\n    opacity: 0; transform: translateY(4px); pointer-events: none;\n    transition: opacity .2s ease, transform .2s ease; z-index: 60;\n  }\n  .rv-card.up { top: auto; bottom: calc(100% + 12px); }\n  .rv-card.shift { left: auto; right: 0; }\n  .rv:hover > .rv-card, .rv:focus-within > .rv-card { opacity: 1; transform: none; }\n  .details-on .rv > .rv-card { display: none; }\n  .details-on .rv { border-bottom-style: solid; }\n\n  /* Per-slide details toggle */\n  .details-toggle {\n    position: absolute; top: 118px; right: 64px;\n    font-family: var(--font-label); font-size: 15px; letter-spacing: 0.22em; text-transform: uppercase;\n    color: var(--grey-800); background: #fff;\n    border: 1px solid var(--grey-200); border-radius: 2px;\n    padding: 9px 16px; cursor: pointer; z-index: 70;\n    display: inline-flex; align-items: center; gap: 12px;\n    transition: color .2s ease, border-color .2s ease;\n  }\n  .details-toggle:hover { color: var(--capital-red); border-color: var(--capital-red); }\n  .details-toggle:focus-visible { outline: 2px solid var(--capital-red); outline-offset: 2px; }\n  .details-toggle .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--grey-300); transition: background .2s ease; }\n  .details-toggle .count { color: var(--capital-red); letter-spacing: 0.12em; }\n  .details-on .details-toggle { color: var(--capital-red); border-color: var(--capital-red); }\n  .details-on .details-toggle .dot { background: var(--capital-red); }\n\n  /* Details mode: every key word's detail laid out in one ordered panel */\n  .rv-rail {\n    position: absolute; right: 64px; top: 224px; bottom: 160px; width: 520px;\n    border-left: 1px solid var(--grey-200); background: #fff; z-index: 65;\n    padding: 0 0 0 44px; box-sizing: border-box;\n    display: grid; grid-auto-rows: min-content;\n    gap: 26px; align-content: start;\n    opacity: 0; pointer-events: none; transition: opacity .35s ease;\n  }\n  .rv-rail.dense { gap: 13px; }\n  .rv-rail.dense .rv-item { grid-template-columns: 36px 1fr; gap: 12px; padding-left: 14px; }\n  .rv-rail.dense .ri-n { font-size: 25px; }\n  .rv-rail.dense .ri-k { font-size: 21px; margin-bottom: 4px; }\n  .rv-rail.dense .ri-d { font-size: 15.5px; line-height: 1.4; }\n  .rv-rail.dense2 { gap: 7px; }\n  .rv-rail.dense2 .rv-item { grid-template-columns: 32px 1fr; gap: 10px; padding-left: 12px; }\n  .rv-rail.dense2 .ri-n { font-size: 22px; }\n  .rv-rail.dense2 .ri-k { font-size: 19px; margin-bottom: 3px; }\n  .rv-rail.dense2 .ri-d { font-size: 14.5px; line-height: 1.3; }\n  .details-on [data-rv-dim] {\n    transform: scale(0.68); transform-origin: left center;\n    transition: transform .35s ease;\n  }\n  .details-on .rv-rail { opacity: 1; pointer-events: auto; }\n  .rv-rail-head {\n    grid-column: 1 / -1; font-family: var(--font-label); font-size: 15px;\n    letter-spacing: 0.22em; text-transform: uppercase; color: var(--capital-red);\n    border-bottom: 2px solid var(--capital-red); padding-bottom: 12px; margin-bottom: 4px;\n  }\n  .rv-item {\n    display: grid; grid-template-columns: 46px 1fr; gap: 16px;\n    border-left: 3px solid var(--grey-200); padding: 4px 0 4px 18px;\n    transition: border-color .2s ease, ba -size:22px;letter-spacing:0.32em;text-transform:uppercase;color:#fff;margin-bottom:52px\">Scarcity as an asset class<\u002Fdiv>\n    <h1 style=\"font-family:var(--font-display);font-weight:300;font-size:136px;line-height:0.92;letter-spacing:-0.04em;color:#fff;margin:0\">The debasement basket<\u002Fh1>\n    <p style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:44px;line-height:1.15;color:#fff;margin:44px 0 0;max-width:30ch\">Compounding real wealth in a regime of structural currency dilution.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"02 Divider - the challenge\" data-speaker-notes=\"Why this matters now: the regime, and what it does to a saver.\" style=\"width:1920px;height:1080px;overflow:hidden;box-sizing:border-box;background:var(--deep-red);color:#fff;font-family:Arial,sans-serif\">\n  <img src=\"e0ad9ade-68b1-416e-9811-ccebd51935fb\" alt=\"Cape Capital\" style=\"position:absolute;top:64px;left:64px;width:130px;z-index:10\">\n  <div style=\"position:absolute;top:66px;right:64px;font-family:var(--font-label);font-size:16px;letter-spacing:0.22em;text-transform:uppercase;color:#fff;z-index:10\">Internal only<\u002Fdiv>\n  <div style=\"position:absolute;bottom:48px;right:64px;font-family:var(--font-label);font-size:20px;letter-spacing:0.22em;color:#fff;z-index:10\">02<\u002Fdiv>\n\n  <div style=\"padding:224px 64px 200px;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center\">\n    <div style=\"width:56px;height:2px;background:#fff;margin:0 0 20px\"><\u002Fdiv>\n    <div style=\"font-family:Arial,sans-serif;font-size:18px;letter-spacing:0.22em;text-transform:uppercase;color:#fff;margin-bottom:30px\">The challenge<\u002Fdiv>\n    <h1 style=\"font-family:var(--font-display);font-weight:300;font-size:100px;letter-spacing:-0.03em;line-height:1.0;margin:0;color:#fff;white-space:nowrap\">A regime <em style=\"font-style:italic\">already in force<\u002Fem><\u002Fh1>\n    <p style=\"font-family:Arial,sans-serif;font-size:26px;line-height:36px;color:#fff;margin:40px 0 0;white-space:nowrap\">Debasement is policy, not forecast - and reported inflation understates it.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"03 The setting\" data-speaker-notes=\"Debt, deficits and money growth are already fixed.\" style=\"width:1920px;height:1080px;overflow:hidden;box-sizing:border-box;background:#fff;color:#000;font-family:Arial,sans-serif\">\n  <img src=\"2a5705b4-f1c6-4242-aebd-98c959fcc200\" alt=\"Cape Capital\" style=\"position:absolute;top:64px;left:64px;width:130px;z-index:10\">\n  <div style=\"position:absolute;top:66px;right:64px;font-family:var(--font-label);font-size:16px;letter-spacing:0.22em;text-transform:uppercase;color:var(--grey-800);z-index:10\">Internal only<\u002Fdiv>\n  <div style=\"position:absolute;bottom:48px;right:64px;font-family:var(--font-label);font-size:20px;letter-spacing:0.22em;color:var(--grey-800);z-index:10\">03<\u002Fdiv>\n  <div data-cite=\"\" style=\"position:absolute;bottom:46px;left:64px;right:220px;font-family:Arial,sans-serif;font-size:16px;line-height:1.4;color:#000;opacity:0.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Sources: IMF Fiscal Monitor, OECD, ECB, BoJ, Federal Reserve H.6, IIF Global Debt Monitor. G7 weighted averages, July 2026.<\u002Fdiv>\n\n  <div style=\"padding:224px 64px 160px;height:100%;box-sizing:border-box;display:flex;flex-direction:column\">\n    <div style=\"margin-bottom:64px\">\n      <div style=\"width:56px;height:2px;background:var(--capital-red);margin:0 0 20px\"><\u002Fdiv>\n      <div style=\"font-family:Arial,sans-serif;font-size:18px;letter-spacing:0.22em;text-transform:uppercase;color:var(--capital-red);height:22px;line-height:22px;margin:0 0 22px;white-space:nowrap;overflow:hidden\">The challenge<\u002Fdiv>\n      <h1 style=\"font-family:var(--font-display);font-weight:300;font-size:56px;letter-spacing:-0.025em;line-height:60px;height:60px;margin:0;white-space:nowrap;color:#000\">Debt, deficits and money all point one way<\u002Fh1>\n      <p style=\"font-family:Arial,sans-serif;font-size:22px;line-height:32px;height:32px;color:var(--grey-800);margin:16px 0 0;white-space:nowrap\"><span class=\"rv\">Debt at scale<span class=\"rv-card\">G7 average debt-to-GDP is ~125%, nearly double the pre-GFC level. Global debt reached a record USD 353tn in the first half of 2026.<\u002Fspan><\u002Fspan> and <span class=\"rv\">forced buyers<span class=\"rv-card\">Banks, insurers and pension funds hold sovereign paper by regulation rather than by choice - a captive bid that clears issuance at real yields below the stabilising level.<\u002Fspan><\u002Fspan> have already locked in the regime.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:104px;align-content:start\">\n      <div style=\"border-top:1px solid var(--grey-200);padding-top:26px\">\n        <div style=\"display:flex;align-items:baseline;gap:4px\"><span style=\"font-family:var(--font-display);font-weight:300;font-size:80px;line-height:0.9;letter-spacing:-0.02em;color:#000\">~125<\u002Fspan><span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:42px;color:var(--capital-red)\">%<\u002Fspan><\u002Fdiv>\n        <div style=\"font-family:var(--font-label);font-size:16px;letter-spacing:0.18em;text-transform:uppercase;color:var(--capital-red);margin-top:12px;height:20px;white-space:nowrap;overflow:hidden\">G7 debt-to-GDP · 2026<\u002Fdiv>\n        <div style=\"margin-top:30px\"><svg sc-camel-view-box=\"0 0 360 150\" style=\"width:100%;height:auto;display:block\" role=\"img\" aria-label=\"G7 debt to GDP 2007 to 2026\">\n            <g stroke=\"var(--grey-100)\" stroke-width=\"1\"><line x1=\"42\" y1=\"34\" x2=\"352\" y2=\"34\"><\u002Fline><line x1=\"42\" y1=\"64\" x2=\"352\" y2=\"64\"><\u002Fline><line x1=\"42\" y1=\"94\" x2=\"352\" y2=\"94\"><\u002Fline><\u002Fg>\n
