002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:12px 0;border-bottom:1px solid var(--grey-200)\">\n          <span style=\"display:flex;align-items:center;gap:10px;font-family:Arial,sans-serif;font-size:16px\"><span style=\"width:20px;height:4px;background:var(--red-300);flex:none\"><\u002Fspan>Gold<span style=\"font-family:var(--font-label);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--capital-red);white-space:nowrap\">above floor<\u002Fspan><\u002Fspan>\n          <span style=\"font-family:var(--font-display);font-size:26px;color:var(--grey-800)\">~13%<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:12px 0;border-bottom:1px solid var(--grey-200)\">\n          <span style=\"display:flex;align-items:center;gap:10px;font-family:Arial,sans-serif;font-size:16px\"><span style=\"width:20px;height:4px;background:var(--beige-400);flex:none\"><\u002Fspan>Copper<span style=\"font-family:var(--font-label);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--capital-red);white-space:nowrap\">above floor<\u002Fspan><\u002Fspan>\n          <span style=\"font-family:var(--font-display);font-size:26px;color:var(--grey-800)\">~8%<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:13px 8px;border-top:2px solid var(--grey-800);border-bottom:2px solid var(--grey-800)\">\n          <span style=\"display:flex;align-items:center;gap:10px;font-family:Arial,sans-serif;font-size:16px\"><span style=\"width:20px;height:4px;background:var(--grey-800);flex:none\"><\u002Fspan><strong style=\"font-weight:400;color:#000\">CPI + 2% floor<\u002Fstrong><span style=\"font-family:var(--font-label);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:#fff;background:var(--grey-800);padding:3px 7px;white-space:nowrap\">the hurdle<\u002Fspan><\u002Fspan>\n          <span style=\"font-family:var(--font-display);font-size:26px;color:var(--grey-800)\">~5%<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:12px 0;border-bottom:1px solid var(--grey-200)\">\n          <span style=\"display:flex;align-items:center;gap:10px;font-family:Arial,sans-serif;font-size:16px\"><span style=\"width:20px;height:4px;background:#9C8F55;flex:none\"><\u002Fspan>Government bonds<span style=\"font-family:var(--font-label);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:#fff;background:#9C8F55;padding:3px 7px;white-space:nowrap\">loses to the floor<\u002Fspan><\u002Fspan>\n          <span style=\"font-family:var(--font-display);font-size:26px;color:var(--grey-800)\">~2%<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"13 Complementarity\" data-speaker-notes=\"FI bleeds in two of three regimes. The basket pays in those two.\" style=\"width:1920px;height:1080px;overflow:hidden;box-sizing:border-box;background:#fff;color:#000;font-family:Arial,sans-serif\">\n  <img src=\"2a5705b4-f1c6-4242-aebd-98c959fcc200\" alt=\"Cape Capital\" style=\"position:absolute;top:64px;left:64px;width:130px;z-index:10\">\n  <div style=\"position:absolute;top:66px;right:64px;font-family:var(--font-label);font-size:16px;letter-spacing:0.22em;text-transform:uppercase;color:var(--grey-800);z-index:10\">Internal only<\u002Fdiv>\n  <div style=\"position:absolute;bottom:48px;right:64px;font-family:var(--font-label);font-size:20px;letter-spacing:0.22em;color:var(--grey-800);z-index:10\">13<\u002Fdiv>\n  <div data-cite=\"\" style=\"position:absolute;bottom:46px;left:64px;right:220px;font-family:Arial,sans-serif;font-size:16px;line-height:1.4;color:#000;opacity:0.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Sources: Bloomberg, LBMA, BLS. Conditional analysis of monthly returns 2015-2026; directional, not magnitudes.<\u002Fdiv>\n\n  <div style=\"padding:224px 64px 160px;height:100%;box-sizing:border-box;display:flex;flex-direction:column\">\n    <div style=\"margin-bottom:64px\">\n      <div style=\"width:56px;height:2px;background:var(--capital-red);margin:0 0 20px\"><\u002Fdiv>\n      <div style=\"font-family:Arial,sans-serif;font-size:18px;letter-spacing:0.22em;text-transform:uppercase;color:var(--capital-red);height:22px;line-height:22px;margin:0 0 22px;white-space:nowrap;overflow:hidden\">The response<\u002Fdiv>\n      <h1 style=\"font-family:var(--font-display);font-weight:300;font-size:56px;letter-spacing:-0.025em;line-height:60px;height:60px;margin:0;white-space:nowrap;color:#000\">The same three regimes, measured in purchasing power<\u002Fh1>\n      <p style=\"font-family:Arial,sans-serif;font-size:22px;line-height:32px;height:32px;color:var(--grey-800);margin:16px 0 0;white-space:nowrap\">Against that same floor, fixed income falls short in two of three regimes - the basket <span class=\"rv\">clears it in those same two<span class=\"rv-card\">That is the definition of a complement rather than a substitute. Each covers the scenario the other cannot, so combined coverage exceeds either allocation alone.<\u002Fspan><\u002Fspan>.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div>\n      <div style=\"display:grid;grid-template-columns:270px 1.55fr 0.85fr;gap:0 42px;font-family:var(--font-label);font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:var(--grey-800);border-bottom:2px solid var(--capital-red);padding-bottom:12px\">\n        <span>Scenario<\u002Fspan>\n        <span style=\"display:flex;justify-content:space-between\"><span>← purchasing power lost<\u002Fspan><span style=\"color:var(--capital-red)\">gained →<\u002Fspan><\u002Fspan>\n        <span>What it means<\u002Fspan>\n      <\u002Fdiv>\n      <div data-rv=\"\" style=\"animation-delay:0.10s;display:grid;grid-template-columns:270px 1.55fr 0.85fr;gap:0 42px;align-items:center;padding:7px 0;border-bottom:1px solid var(--grey-200)\">\n        <div style=\"display:flex;align-items:flex-start;gap:13px\">\n          <span style=\"background:var(--capital-red);color:#fff;font-family:var(--font-label);font-size:13px;letter-spacing:0.06em;padding:6px 9px;flex:none\">01<\u002Fspan>\n          <span><span style=\"display:block;font-family:var(--font-display);font-weight:300;font-size:26px;line-height:1.1\">Inflation surprises high<\u002Fspan><span style=\"display:block;font-family:Arial,sans-serif;font-size:14px;color:var(--grey-800);margin-top:4px\">CPI 4-5%, deficits widening<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div><svg sc-camel-view-box=\"0 0 920 104\" style=\"width:100%;height:auto;display:block\" role=\"img\" aria-label=\"Fixed income and the basket move in opposite directions\">\n      <line x1=\"432\" y1=\"4\" x2=\"432\" y2=\"100\" stroke=\"var(--grey-800)\" stroke-width=\"1.4\"><\u002Fline>\n      <rect data-rv-bar=\"\" style=\"animation-delay:0.45s;transform-origin:right center\" x=\"40\" y=\"10\" width=\"392\" height=\"34\" fill=\"#9C8F55\"><\u002Frect>\n      <text x=\"414\" y=\"33\" text-anchor=\"end\" font-family=\"PPRadioGrotesk, Arial, sans-serif\" font-weight=\"700\" font-size=\"16\" letter-spacing=\"1.6\" fill=\"#fff\">FIXED INCOME<\u002Ftext>\n      <rect data-rv-bar=\"\" style=\"animation-delay:0.45s;transform-origin:left center\" x=\"432\" y=\"60\" width=\"392\" height=\"34\" fill=\"var(--capital-red)\"><\u002Frect>\n      <text x=\"450\" y=\"83\" text-anchor=\"start\" font-family=\"PPRadioGrotesk, Arial, sans-serif\" font-weight=\"700\" font-size=\"16\" letter-spacing=\"1.6\" fill=\"#fff\">BASKET<\u002Ftext>\n      \n    <\u002Fsvg><\u002Fdiv>\n        <div style=\"font-family:Arial,sans-serif;font-size:17px;line-height:1.45;color:var(--grey-800);border-left:1px solid var(--grey-200);padding-left:22px\"><span class=\"rv\">Where bonds hurt most<span class=\"rv-card\">Coupons are fixed below the print and par leaks fastest. Scarce-asset bids accelerate as each CPI release lands.<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div data-rv=\"\" style=\"animation-delay:0.20s;display:grid;grid-template-columns:270px 1.55fr 0.85fr;gap:0 42px;align-items:center;padding:7px 0;border-bottom:1px solid var(--grey-200)\">\n        <div style=\"display:flex;align-items:flex-start;gap:13px\">\n          <span style=\"background:var(--capital-red);color:#fff;font-family:var(--font-label);font-size:13px;letter-spacing:0.06em;padding:6px 9px;flex:none\">02<\u002Fspan>\n          <span><span style=\"display:block;font-family:var(--font-display);font-weight:300;font-size:26px;line-height:1.1\">Silent debasement<\u002Fspan><span style=\"display:block;font-family:Arial,sans-serif;font-size:14px;color:var(--grey-800);margin-top:4px\">CPI 2-3%, M2 outpaces output<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div><svg sc-camel-view-box=\"0 0 920 104\" style=\"width:100%;height:auto;display:block\" role=\"img\" aria-label=\"Fixed income and the basket move in opposite directions\">\n      <line x1=\"432\" y1=\"4\" x2=\"432\" y2=\"100\" stroke=\"var(--grey-800)\" stroke-width=\"1.4\"><\u002Fline>\n      <rect x=\"429\" y=\"14\" width=\"6\" height=\"26\" fill=\"#9C8F55\"><\u002Frect>\n      <text x=\"380\" y=\"33\" text-anchor=\"end\" font-family=\"PPRadioGrotesk, Arial, sans-serif\" font-weight=\"700\" font-size=\"16\" letter-spacing=\"1.6\" fill=\"var(--grey-800)\">FIXED INCOME · FLAT<\u002Ftext>\n      <rect data-rv-bar=\"\" style=\"animation-delay:0.55s;transform-origin:left center\" x=\"432\" y=\"60\" width=\"196\" height=\"34\" fill=\"var(--capital-red)\"><\u002Frect>\n      <text x=\"644\" y=\"83\" text-anchor=\"start\" font-family=\"PPRadioGrotesk, Arial, sans-serif\" font-weight=\"700\" font-size=\"16\" letter-spacing=\"1.6\" fill=\"var(--grey-800)\">BASKET<\u002Ftext>\n      \n    <\u002Fsvg><\u002Fdiv>\n        <div style=\"font-family:Arial,sans-serif;font-size:17px;line-height:1.45;color:var(--grey-800);border-left:1px solid var(--grey-200);padding-left:22px\"><span class=\"rv\">The quiet compounding<span class=\"rv-card\">Bonds tread water in real terms while the basket compounds quietly - the 2010-19 pattern, and the most likely path from here. Neither rescues the other.<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div data-rv=\"\" style=\"animation-delay:0.30s;display:grid;grid-template-columns:270px 1.55fr 0.85fr;gap:0 42px;align-items:center;padding:7px 0;border-bottom:1px solid var(--grey-200)\">\n        <div style=\"display:flex;align-items:flex-start;gap:13px\">\n          <span style=\"background:var(--capital-red);color:#fff;font-family:var(--font-label);font-size:13px;letter-spacing:0.06em;padding:6px 9px;flex:none\">03<\u002Fspan>\n          <span><span style=\"display:block;font-family:var(--font-display);font-weight:300;font-size:26px;line-height:1.1\">Deflation / liquidity crunch<\u002Fspan><span style=\"display:block;font-family:Arial,sans-serif;font-size:14px;color:var(--grey-800);margin-top:4px\">risk-off, dollar bid<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div><svg sc-camel-view-box=\"0 0 920 104\" style=\"width:100%;height:auto;display:block\" role=\"img\" aria-label=\"Fixed income and the basket move in opposite directions\">\n      <line x1=\"432\" y1=\"4\" x2=\"432\" y2=\"100\" stroke=\"var(--grey-800)\" stroke-width=\"1.4\"><\u002Fline>\n      <rect data-rv-bar=\"\" style=\"animation-delay:0.65s;transform-origin:left center\" x=\"432\" y=\"10\" width=\"392\" height=\"34\" fill=\"#9C8F55\"><\u002Frect>\n      <text x=\"450\" y=\"33\" text-anchor=\"start\" font-family=\"PPRadioGrotesk, Arial, sans-serif\" font-weight=\"700\" font-size=\"16\" letter-spacing=\"1.6\" fill=\"#fff\">FIXED INCOME<\u002Ftext>\n      <rect data-rv-bar=\"\" style=\"animation-delay:0.65s;transform-origin:right center\" x=\"236\" y=\"60\" width=\"196\" height=\"34\" fill=\"var(--capital-red)\"><\u002Frect>\n      <text x=\"220\" y=\"83\" text-anchor=\"end\" font-family=\"PPRadioGrotesk, Arial, sans-serif\" font-weight=\"700\" font-size=\"16\" letter-spacing=\"1.6\" fill=\"var(--grey-800)\">BASKET<\u002Ftext>\n      \n    <\u002Fsvg><\u002Fdiv>\n        <div style=\"font-family:Arial,sans-serif;font-size:17px;line-height:1.45;color:var(--grey-800);border-left:1px solid var(--grey-200);padding-left:22px\"><span class=\"rv\">Where bonds save the basket<span class=\"rv-card\">The one regime the basket cannot carry: duration rallies while scarce assets are sold for liquidity - bitcoin faster than gold. Bonds protect the portfolio here, not the basket.<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div data-rv=\"\" style=\"animation-delay:.8s;display:grid;grid-template-columns:270px 1fr;gap:42px;margin-top:18px\">\n        <span style=\"font-family:var(--font-label);font-size:13px;letter-spacing:0.18em;text-transform:uppercase;color:var(--capital-red)\">The pattern<\u002Fspan>\n        <span style=\"font-family:var(--font-display);font-weight:300;font-size:29px;line-height:1.2;color:#000\">In every scenario the two point opposite ways - which is what makes them complements rather than substitutes.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<section data-screen-label=\"14 What moves gold\" data-speaker-notes=\"Real rates dominate. Nominal rates explain almost nothing.\" style=\"width:1920px;height:1080px;overflow:hidden;box-sizing:border-box;background:#fff;color:#000;font-family:Arial,sans-serif\">\n  <img src=\"2a5705b4-f1c6-4242-aebd-98c959fcc200\" alt=\"Cape Capital\" style=\"position:absolute;top:64px;left:64px;width:130px;z-index:10\">\n  <div style=\"position:absolute;top:66px;right:64px;font-family:var(--font-label);font-size:16px;letter-spacing:0.22em;text-transform:uppercase;color:var(--grey-800);z-index:10\">Internal only<\u002Fdiv>\n  <div style=\"position:absolute;bottom:48px;right:64px;font-family:var(--font-label);font-size:20px;letter-spacing:0.22em;color:var(--grey-800);z-index:10\">14<\u002Fdiv>\n  <div data-cite=\"\" style=\"position:absolute;bottom:46px;left:64px;right:220px;font-family:Arial,sans-serif;font-size:16px;line-height:1.4;color:#000;opacity:0.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Sources: LBMA, US Treasury, Federal Reserve, JPMorgan DM sovereign spread index. 5y rolling correlations, 2010 - Jun 2026.<\u002Fdiv>\n\n  <div style=\"padding:224px 64px 160px;height:100%;box-sizing:border-box;display:flex;flex-direction:column\">\n    <div style=\"margin-bottom:64px\">\n      <div style=\"width:56px;height:2px;background:var(--capital-red);margin:0 0 20px\"><\u002Fdiv>\n      <div style=\"font-family:Arial,sans-serif;font-size:18px;letter-spacing:0.22em;text-transform:uppercase;color:var(--capital-red);height:22px;line-height:22px;margin:0 0 22px;white-space:nowrap;overflow:hidden\">The response<\u002Fdiv>\n      <h1 style=\"font-family:var(--font-display);font-weight:300;font-size:56px;letter-spacing:-0.025em;line-height:60px;height:60px;margin:0;white-space:nowrap;color:#000\">Gold as the example: what actually moves it<\u002Fh1>\n      <p style=\"font-family:Arial,sans-serif;font-size:22px;line-height:32px;height:32px;color:var(--grey-800);margin:16px 0 0;white-space:nowrap\">Gold has the longest record, so it is the proxy: only two of the four engines matter, and both are <span class=\"rv\">regime tailwinds<span class=\"rv-card\">Real rates and inflation expectations are precisely the variables a fiscally dominant regime suppresses and repricess. The drivers of gold and the mechanics of debasement are the same thing.<\u002Fspan><\u002Fspan>.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div style=\"display:grid;grid-template-columns:56px 300px 150px 360px 1fr;gap:0 34px;font-family:var(--font-label);font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:var(--grey-800);border-bottom:2px solid var(--capital-red);padding-bottom:14px\">\n        <span><\u002Fspan><span>Driver<\u002Fspan><span>Correlation<\u002Fspan><span>Explanatory power<\u002Fspan><span>How it reaches the gold price<\u002Fspan>\n      <\u002Fdiv>\n      <div data-rv=\"\" style=\"animation-delay:0.10s;display:grid;grid-template-columns:56px 300px 150px 360px 1fr;gap:0 34px;align-items:center;padding:16px 14px;border-bottom:1px solid var(--grey-200);background:var(--beige-100)\">\n        <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:44px;line-height:1;color:var(--capital-red)\">1<\u002Fspan>\n        <span style=\"font-family:var(--font-display);font-weight:300;font-size:30px;line-height:1.1;color:#000\">Real rates<\u002Fspan><span><span style=\"display:block;height:12px;background:#fff\"><span data-rv-bar=\"\" style=\"animation-delay:0.50s;display:block;height:100%;width:68%;background:var(--capital-red)\"><\u002Fspan><\u002Fspan><span style=\"display:block;font-family:var(--font-label);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--grey-800);margin-top:8px\">core driver<\u002Fspan><\u002Fspan>\n        <span style=\"font-family:var(--font-display);font-weight:300;font-size:46px;line-height:1;color:var(--capital-red)\">−0.68<\u002Fspan>\n        <span style=\"font-family:Arial,sans-serif;font-size:19px;line-height:1.45;color:var(--grey-800)\"><strong style=\"color:#000;font-weight:400\">Real rates fall, gold rises<\u002Fstrong> — <span class=\"rv\">the opportunity-cost channel<span class=\"rv-card\">Gold pays no coupon, so its appeal is set against what a risk-free real yield offers. Push that yield down and the cost of holding gold falls with it.<\u002Fspan><\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div data-rv=\"\" style=\"animation-delay:0.20s;display:grid;grid-template-columns:56px 300px 150px 360px 1fr;gap:0 34px;align-items:center;padding:16px 14px;border-bottom:1px solid var(--grey-200);background:var(--beige-100)\">\n        <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:44px;line-height:1;color:var(--capital-red)\">2<\u002Fspan>\n        <span style=\"font-family:var(--font-display);font-weight:300;font-size:30px;line-height:1.1;color:#000\">Inflation expectations<\u002Fspan><span><span style=\"display:block;height:12px;background:#fff\"><span data-rv-bar=\"\" style=\"animation-delay:0.60s;display:block;height:100%;width:45%;background:var(--capital-red)\"><\u002Fspan><\u002Fspan><span style=\"display:block;font-family:var(--font-label);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--grey-800);margin-top:8px\">core driver<\u002Fspan><\u002Fspan>\n        <span style=\"font-family:var(--font-display);font-weight:300;font-size:46px;line-height:1;color:var(--capital-red)\">+0.45<\u002Fspan>\n        <span style=\"font-family:Arial,sans-serif;font-size:19px;line-height:1.45;color:var(--grey-800)\"><strong style=\"color:#000;font-weight:400\">Expectations reprice, gold reprices with them<\u002Fstrong> — <span class=\"rv\">the repricing channel<span class=\"rv-card\">Gold captures inflation expectations as they reset, not after the fact.<\u002Fspan><\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div data-rv=\"\" style=\"animation-delay:0.30s;display:grid;grid-template-columns:56px 300px 150px 360px 1fr;gap:0 34px;align-items:center;padding:16px 0;border-bottom:1px solid var(--grey-200)\">\n        <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:44px;line-height:1;color:var(--grey-400)\">3<\u002Fspan>\n        <span style=\"font-family:var(--font-display);font-weight:300;font-size:30px;line-height:1.1;color:#000\">DM sovereign spreads<\u002Fspan><span><span style=\"display:block;height:12px;background:var(--grey-100)\"><span data-rv-bar=\"\" style=\"animation-delay:0.70s;display:block;height:100%;width:42%;background:var(--grey-400)\"><\u002Fspan><\u002Fspan><span style=\"display:block;font-family:var(--font-label);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--grey-800);margin-top:8px\">background<\u002Fspan><\u002Fspan>\n        <span style=\"font-family:var(--font-display);font-weight:300;font-size:46px;line-height:1;color:var(--grey-800)\">+0.42<\u002Fspan>\n        <span style=\"font-family:Arial,sans-serif;font-size:19px;line-height:1.45;color:var(--grey-800)\"><strong style=\"color:#000;font-weight:400\">Fiscal credibility slips, both are bid<\u002Fstrong> — <span class=\"rv\">the sovereign-stress channel<span class=\"rv-card\">Wider sovereign spreads and a firmer gold price are two readings of the same doubt.<\u002Fspan><\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div data-rv=\"\" style=\"animation-delay:0.40s;display:grid;grid-template-columns:56px 300px 150px 360px 1fr;gap:0 34px;align-items:center;padding:16px 0;border-bottom:1px solid var(--grey-200)\">\n        <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:44px;line-height:1;color:var(--grey-400)\">4<\u002Fspan>\n        <span style=\"font-family:var(--font-display);font-weight:300;font-size:30px;line-height:1.1;color:#000\">Nominal rates<\u002Fspan><span><span style=\"display:block;height:12px;background:var(--grey-100)\"><span data-rv-bar=\"\" style=\"animation-delay:0.80s;display:block;height:100%;width:12%;background:var(--grey-400)\"><\u002Fspan><\u002Fspan><span style=\"display:block;font-family:var(--font-label);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--grey-800);margin-top:8px\">background<\u002Fspan><\u002Fspan>\n        <span style=\"font-family:var(--font-display);font-weight:300;font-size:46px;line-height:1;color:var(--grey-800)\">−0.12<\u002Fspan>\n        <span style=\"font-family:Arial,sans-serif;font-size:19px;line-height:1.45;color:var(--grey-800)\"><strong style=\"color:#000;font-weight:400\">No usable signal on its own<\u002Fstrong> — <span class=\"rv\">too noisy to act on<span class=\"rv-card\">Wide scatter, flat slope: the headline yield says nothing until inflation is subtracted.<\u002Fspan><\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div data-rv=\"\" style=\"animation-delay:.6s;display:flex;align-items:baseline;gap:40px;margin-top:36px;border-left:4px solid var(--capital-red);padding:12px 0 12px 28px\">\n        <span style=\"font-family:var(--font-display);font-weight:300;font-size:34px;line-height:1.2;color:#000\">The two strongest drivers are exactly what a fiscally dominant regime produces.<\u002Fspan>\n        <span style=\"font-family:Arial,sans-serif;font-size:18px;line-height:1.5;color:var(--grey-800);max-width:40ch\"><span class=\"rv\">The same mechanism, twice<span class=\"rv-card\">Low real rates and repricing inflation expectations are not separate risks - they are two symptoms of debt being inflated away. What drives gold drives debasement.<\u002Fspan><\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"15 Gold correlations by regime\" data-speaker-notes=\"The right dot is where we live now.\" style=\"width:1920px;height:1080px;overflow:hidden;box-sizing:border-box;background:#fff;color:#000;font-family:Arial,sans-serif\">\n  <img src=\"2a5705b4-f1c6-4242-aebd-98c959fcc200\" alt=\"Cape Capital\" style=\"position:absolute;top:64px;left:64px;width:130px;z-index:10\">\n  <div style=\"position:absolute;top:66px;right:64px;font-family:var(--font-label);font-size:16px;letter-spacing:0.22em;text-transform:uppercase;color:var(--grey-800);z-index:10\">Internal only<\u002Fdiv>\n  <div style=\"position:absolute;bottom:48px;right:64px;font-family:var(--font-label);font-size:20px;letter-spacing:0.22em;color:var(--grey-800);z-index:10\">15<\u002Fdiv>\n  <div data-cite=\"\" style=\"position:absolute;bottom:46px;left:64px;right:220px;font-family:Arial,sans-serif;font-size:16px;line-height:1.4;color:#000;opacity:0.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Sources: LBMA, Federal Reserve H.6, BLS, NBER, Bloomberg. 5y rolling correlations; CPI YoY split at 2.5%, 2000 - Jun 2026.<\u002Fdiv>\n\n  <div style=\"padding:224px 64px 160px;height:100%;box-sizing:border-box;display:flex;flex-direction:column\">\n    <div style=\"margin-bottom:64px\">\n      <div style=\"width:56px;height:2px;background:var(--capital-red);margin:0 0 20px\"><\u002Fdiv>\n      <div style=\"font-family:Arial,sans-serif;font-size:18px;letter-spacing:0.22em;text-transform:uppercase;color:var(--capital-red);height:22px;line-height:22px;margin:0 0 22px;white-space:nowrap;overflow:hidden\">The response<\u002Fdiv>\n      <h1 style=\"font-family:var(--font-display);font-weight:300;font-size:56px;letter-spacing:-0.025em;line-height:60px;height:60px;margin:0;white-space:nowrap;color:#000\">Gold’s correlations flip with the inflation regime<\u002Fh1>\n      <p style=\"font-family:Arial,sans-serif;font-size:22px;line-height:32px;height:32px;color:var(--grey-800);margin:16px 0 0;white-space:nowrap\">Each bar is a correlation coefficient, and shows how far it <span class=\"rv\">moves between regimes<span class=\"rv-card\">Pooled across all periods the correlations look modest. Split by whether CPI is above or below 2.5%, the same exposure plays a different portfolio role entirely.<\u002Fspan><\u002Fspan> - the filled dot is today.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n<svg sc-camel-view-box=\"0 0 1290 288\" style=\"width:100%;max-height:400px;height:auto;display:block\" role=\"img\" aria-label=\"Gold correlations shift between disinflation and inflation regimes\">\n          <text x=\"0\" y=\"16\" font-family=\"PPRadioGrotesk, Arial, sans-serif\" font-weight=\"700\" font-size=\"13\" letter-spacing=\"2\" fill=\"var(--grey-800)\">CORRELATION OF GOLD WITH EACH DRIVER · BY REGIME<\u002Ftext>\n          <line x1=\"707.3\" y1=\"26\" x2=\"707.3\" y2=\"252\" stroke=\"var(--grey-800)\" stroke-width=\"1.3\"><\u002Fline>\n          <text x=\"707.3\" y=\"20\" text-anchor=\"middle\" font-family=\"PPRadioGrotesk, Arial, sans-serif\" font-weight=\"700\" font-size=\"12\" letter-spacing=\"2\" fill=\"var(--grey-800)\">ZERO<\u002Ftext>\n          <g font-family=\"Arial, sans-serif\" font-size=\"14\" fill=\"var(--grey-800)\" text-anchor=\"middle\"><text x=\"445.0\" y=\"276\">-0.4<\u002Ftext><text x=\"576.2\" y=\"276\">-0.2<\u002Ftext><text x=\"707.3\" y=\"276\">0.0<\u002Ftext><text x=\"838.5\" y=\"276\">+0.2<\u002Ftext><text x=\"969.7\" y=\"276\">+0.4<\u002Ftext><text x=\"1100.8\" y=\"276\">+0.6<\u002Ftext><text x=\"1232.0\" y=\"276\">+0.8<\u002Ftext><\u002Fg>\n          <text x=\"0\" y=\"47\" font-family=\"Arial, sans-serif\" font-size=\"23\" fill=\"#000\">M2 · broad money<\u002Ftext>\n          <line data-rv-bar=\"\" style=\"animation-delay:0.35s;transform-origin:left center\" x1=\"969.7\" y1=\"40\" x2=\"1166.4\" y2=\"40\" stroke=\"var(--capital-red)\" stroke-width=\"3\"><\u002Fline>\n          <circle cx=\"969.7\" cy=\"40\" r=\"7\" fill=\"#fff\" stroke=\"var(--grey-400)\" stroke-width=\"2.4\"><\u002Fcircle>\n          <circle data-rv=\"\" style=\"animation-delay:0.80s\" cx=\"1166.4\" cy=\"40\" r=\"9\" fill=\"var(--capital-red)\"><\u002Fcircle>\n          <text data-rv=\"\" style=\"animation-delay:0.90s\" x=\"1186.4\" y=\"47\" text-anchor=\"start\" font-family=\"PPEiko, Georgia, serif\" font-size=\"26\" fill=\"var(--capital-red)\">+0.70<\u002Ftext>\n          <text x=\"953.7\" y=\"45\" text-anchor=\"end\" font-family=\"Arial, sans-serif\" font-size=\"16\" fill=\"var(--grey-400)\">+0.40<\u002Ftext>\n          <text x=\"0\" y=\"95\" font-family=\"Arial, sans-serif\" font-size=\"23\" fill=\"#000\">Inflation expectations<\u002Ftext>\n          <line data-rv-bar=\"\" style=\"animation-delay:0.44s;transform-origin:left center\" x1=\"772.9\" y1=\"88\" x2=\"1068.0\" y2=\"88\" stroke=\"var(--capital-red)\" stroke-width=\"3\"><\u002Fline>\n          <circle cx=\"772.9\" cy=\"88\" r=\"7\" fill=\"#fff\" stroke=\"var(--grey-400)\" stroke-width=\"2.4\"><\u002Fcircle>\n          <circle data-rv=\"\" style=\"animation-delay:0.89s\" cx=\"1068.0\" cy=\"88\" r=\"9\" fill=\"var(--capital-red)\"><\u002Fcircle>\n          <text data-rv=\"\" style=\"animation-delay:0.99s\" x=\"1088.0\" y=\"95\" text-anchor=\"start\" font-family=\"PPEiko, Georgia, serif\" font-size=\"26\" fill=\"var(--capital-red)\">+0.55<\u002Ftext>\n          <text x=\"756.9\" y=\"93\" text-anchor=\"end\" font-family=\"Arial, sans-serif\" font-size=\"16\" fill=\"var(--grey-400)\">+0.10<\u002Ftext>\n          <text x=\"0\" y=\"143\" font-family=\"Arial, sans-serif\" font-size=\"23\" fill=\"#000\">Recessions<\u002Ftext>\n          <line data-rv-bar=\"\" style=\"animation-delay:0.53s;transform-origin:left center\" x1=\"641.8\" y1=\"136\" x2=\"1002.5\" y2=\"136\" stroke=\"var(--capital-red)\" stroke-width=\"3\"><\u002Fline>\n          <circle cx=\"641.8\" cy=\"136\" r=\"7\" fill=\"#fff\" stroke=\"var(--grey-400)\" stroke-width=\"2.4\"><\u002Fcircle>\n          <circle data-rv=\"\" style=\"animation-delay:0.98s\" cx=\"1002.5\" cy=\"136\" r=\"9\" fill=\"var(--capital-red)\"><\u002Fcircle>\n          <text data-rv=\"\" style=\"animation-delay:1.08s\" x=\"1022.5\" y=\"143\" text-anchor=\"start\" font-family=\"PPEiko, Georgia, serif\" font-size=\"26\" fill=\"var(--capital-red)\">+0.45<\u002Ftext>\n          <text x=\"625.8\" y=\"141\" text-anchor=\"end\" font-family=\"Arial, sans-serif\" font-size=\"16\" fill=\"var(--grey-400)\">-0.10<\u002Ftext>\n          <text x=\"0\" y=\"191\" font-family=\"Arial, sans-serif\" font-size=\"23\" fill=\"#000\">Equities<\u002Ftext>\n          <line data-rv-bar=\"\" style=\"animation-delay:0.62s;transform-origin:right center\" x1=\"871.3\" y1=\"184\" x2=\"609.0\" y2=\"184\" stroke=\"var(--grey-400)\" stroke-width=\"3\"><\u002Fline>\n          <circle cx=\"871.3\" cy=\"184\" r=\"7\" fill=\"#fff\" stroke=\"var(--grey-400)\" stroke-width=\"2.4\"><\u002Fcircle>\n          <circle data-rv=\"\" style=\"animation-delay:1.07s\" cx=\"609.0\" cy=\"184\" r=\"9\" fill=\"var(--grey-400)\"><\u002Fcircle>\n          <text data-rv=\"\" style=\"animation-delay:1.17s\" x=\"589.0\" y=\"191\" text-anchor=\"end\" font-family=\"PPEiko, Georgia, serif\" font-size=\"26\" fill=\"var(--grey-800)\">-0.15<\u002Ftext>\n          <text x=\"887.3\" y=\"189\" text-anchor=\"start\" font-family=\"Arial, sans-serif\" font-size=\"16\" fill=\"var(--grey-400)\">+0.25<\u002Ftext>\n          <text x=\"0\" y=\"239\" font-family=\"Arial, sans-serif\" font-size=\"23\" fill=\"#000\">Government bonds<\u002Ftext>\n          <line data-rv-bar=\"\" style=\"animation-delay:0.71s;transform-origin:right center\" x1=\"904.1\" y1=\"232\" x2=\"576.2\" y2=\"232\" stroke=\"var(--grey-400)\" stroke-width=\"3\"><\u002Fline>\n          <circle cx=\"904.1\" cy=\"232\" r=\"7\" fill=\"#fff\" stroke=\"var(--grey-400)\" stroke-width=\"2.4\"><\u002Fcircle>\n          <circle data-rv=\"\" style=\"animation-delay:1.16s\" cx=\"576.2\" cy=\"232\" r=\"9\" fill=\"var(--grey-400)\"><\u002Fcircle>\n          <text data-rv=\"\" style=\"animation-delay:1.26s\" x=\"556.2\" y=\"239\" text-anchor=\"end\" font-family=\"PPEiko, Georgia, serif\" font-size=\"26\" fill=\"var(--grey-800)\">-0.20<\u002Ftext>\n          <text x=\"920.1\" y=\"237\" text-anchor=\"start\" font-family=\"Arial, sans-serif\" font-size=\"16\" fill=\"var(--grey-400)\">+0.30<\u002Ftext>\n        <\u002Fsvg>\n        <div style=\"display:grid;grid-template-columns:330px 1fr 1fr;gap:0 32px;margin-top:14px;align-items:baseline\">\n          <span style=\"font-family:var(--font-label);font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--grey-400)\">Correlation of gold with each driver<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:11px;font-family:Arial,sans-serif;font-size:17px;color:var(--grey-800)\"><span style=\"width:15px;height:15px;border:2.4px solid var(--grey-400);border-radius:50%;background:#fff;flex:none\"><\u002Fspan><span><strong style=\"font-weight:400;color:#000\">Disinflation regime<\u002Fstrong> · CPI below 2.5%<\u002Fspan><\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:11px;font-family:Arial,sans-serif;font-size:17px;color:var(--grey-800)\"><span style=\"width:17px;height:17px;border-radius:50%;background:var(--capital-red);flex:none\"><\u002Fspan><span><strong style=\"font-weight:400;color:#000\">Inflation regime<\u002Fstrong> · CPI 2.5% or above · today<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"16 Divider - the execution\" data-speaker-notes=\"How it fits: funded from bonds, sized to the mandate, opened leg by leg.\" style=\"width:1920px;height:1080px;overflow:hidden;box-sizing:border-box;background:var(--deep-red);color:#fff;font-family:Arial,sans-serif\">\n  <img src=\"e0ad9ade-68b1-416e-9811-ccebd51935fb\" alt=\"Cape Capital\" style=\"position:absolute;top:64px;left:64px;width:130px;z-index:10\">\n  <div style=\"position:absolute;top:66px;right:64px;font-family:var(--font-label);font-size:16px;letter-spacing:0.22em;text-transform:uppercase;color:#fff;z-index:10\">Internal only<\u002Fdiv>\n  <div style=\"position:absolute;bottom:48px;right:64px;font-family:var(--font-label);font-size:20px;letter-spacing:0.22em;color:#fff;z-index:10\">16<\u002Fdiv>\n\n  <div style=\"padding:224px 64px 200px;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center\">\n    <div style=\"width:56px;height:2px;background:#fff;margin:0 0 20px\"><\u002Fdiv>\n    <div style=\"font-family:Arial,sans-serif;font-size:18px;letter-spacing:0.22em;text-transform:uppercase;color:#fff;margin-bottom:30px\">The execution<\u002Fdiv>\n    <h1 style=\"font-family:var(--font-display);font-weight:300;font-size:100px;letter-spacing:-0.03em;line-height:1.0;margin:0;color:#fff;white-space:nowrap\">Funding, sizing and <em style=\"font-style:italic\">opening the position<\u002Fem><\u002Fh1>\n    <p style=\"font-family:Arial,sans-serif;font-size:26px;line-height:36px;color:#fff;margin:40px 0 0;white-space:nowrap\">Where it sits beside fixed income, the size it warrants, and the instrument per leg.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"17 Investment neighbours\" data-speaker-notes=\"A separate asset class, run through the fixed-income and macro process.\" style=\"width:1920px;height:1080px;overflow:hidden;box-sizing:border-box;background:#fff;color:#000;font-family:Arial,sans-serif\">\n  <img src=\"2a5705b4-f1c6-4242-aebd-98c959fcc200\" alt=\"Cape Capital\" style=\"position:absolute;top:64px;left:64px;width:130px;z-index:10\">\n  <div style=\"position:absolute;top:66px;right:64px;font-family:var(--font-label);font-size:16px;letter-spacing:0.22em;text-transform:uppercase;color:var(--grey-800);z-index:10\">Internal only<\u002Fdiv>\n  <div style=\"position:absolute;bottom:48px;right:64px;font-family:var(--font-label);font-size:20px;letter-spacing:0.22em;color:var(--grey-800);z-index:10\">17<\u002Fdiv>\n  <div data-cite=\"\" style=\"position:absolute;bottom:46px;left:64px;right:220px;font-family:Arial,sans-serif;font-size:16px;line-height:1.4;color:#000;opacity:0.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Sources: BIS Quarterly Review, IMF Global Financial Stability Report. Asset class in the conventional sense: distinct drivers, profile and horizon.<\u002Fdiv>\n\n  <div style=\"padding:224px 64px 160px;height:100%;box-sizing:border-box;display:flex;flex-direction:column\">\n    <div style=\"margin-bottom:64px\">\n      <div style=\"width:56px;height:2px;background:var(--capital-red);margin:0 0 20px\"><\u002Fdiv>\n      <div style=\"font-family:Arial,sans-serif;font-size:18px;letter-spacing:0.22em;text-transform:uppercase;color:var(--capital-red);height:22px;line-height:22px;margin:0 0 22px;white-space:nowrap;overflow:hidden\">The execution<\u002Fdiv>\n      <h1 style=\"font-family:var(--font-display);font-weight:300;font-size:56px;letter-spacing:-0.025em;line-height:60px;height:60px;margin:0;white-space:nowrap;color:#000\">Funded from the same capital as the bond allocation<\u002Fh1>\n      <p style=\"font-family:Arial,sans-serif;font-size:22px;line-height:32px;height:32px;color:var(--grey-800);margin:16px 0 0;white-space:nowrap\">Distinct risk drivers, distinct return profile - but <span class=\"rv\">the same investment process<span class=\"rv-card\">Both are sized against rates, inflation and the regime. Same desk, same macro lens, same decision framework - different instruments.<\u002Fspan><\u002Fspan>.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"margin-bottom:52px\">\n<svg sc-camel-view-box=\"0 0 1702 190\" style=\"width:100%;max-height:200px;height:auto;display:block\" role=\"img\" aria-label=\"A client portfolio split into equity, fixed income and scarcity\">\n            <text x=\"0\" y=\"16\" font-family=\"PPRadioGrotesk, Arial, sans-serif\" font-weight=\"700\" font-size=\"13\" letter-spacing=\"2.4\" fill=\"var(--grey-800)\">A CLIENT PORTFOLIO · THREE ASSET CLASSES<\u002Ftext>\n            <rect data-rv-bar=\"\" style=\"animation-delay:.35s\" x=\"0\" y=\"38\" width=\"1168\" height=\"62\" fill=\"var(--grey-300)\"><\u002Frect>\n            <rect data-rv-bar=\"\" style=\"animation-delay:.48s\" x=\"1174\" y=\"38\" width=\"419\" height=\"62\" fill=\"var(--red-500)\"><\u002Frect>\n            <rect data-rv-bar=\"\" style=\"animation-delay:.60s\" x=\"1599\" y=\"38\" width=\"103\" height=\"62\" fill=\"var(--capital-red)\"><\u002Frect>\n            <text x=\"24\" y=\"76\" font-family=\"PPRadioGrotesk, Arial, sans-serif\" font-weight=\"700\" font-size=\"15\" letter-spacing=\"2\" fill=\"#000\">EQUITY · GROWTH<\u002Ftext>\n            <text x=\"1196\" y=\"76\" font-family=\"PPRadioGrotesk, Arial, sans-serif\" font-weight=\"700\" font-size=\"15\" letter-spacing=\"2\" fill=\"#fff\">FIXED INCOME · STABILITY<\u002Ftext>\n            <text x=\"1650.5\" y=\"76\" text-anchor=\"middle\" font-family=\"PPRadioGrotesk, Arial, sans-serif\" font-weight=\"700\" font-size=\"14\" letter-spacing=\"1\" fill=\"#fff\">SCARCITY<\u002Ftext>\n            <g data-rv=\"\" style=\"animation-delay:.9s\">\n              <path d=\"M1174,118 L1174,132 L1702,132 L1702,118\" fill=\"none\" stroke=\"var(--capital-red)\" stroke-width=\"1.6\"><\u002Fpath>\n              <line x1=\"1438\" y1=\"132\" x2=\"1438\" y2=\"146\" stroke=\"var(--capital-red)\" stroke-width=\"1.6\"><\u002Fline>\n              <text x=\"1438\" y=\"168\" text-anchor=\"middle\" font-family=\"PPRadioGrotesk, Arial, sans-serif\" font-weight=\"700\" font-size=\"14\" letter-spacing=\"2.2\" fill=\"var(--capital-red)\">THE NON-EQUITY SPACE · NATURAL NEIGHBOURS<\u002Ftext>\n              <text x=\"1438\" y=\"188\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"15\" fill=\"var(--grey-800)\">two asset classes, one investment process<\u002Ftext>\n            <\u002Fg>\n          <\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:76px\">\n      <div style=\"border-top:1px solid var(--grey-200);padding-top:22px\">\n        <div style=\"display:flex;align-items:baseline;gap:14px\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:34px;line-height:1;color:var(--capital-red)\">01<\u002Fspan>\n          <span style=\"font-family:var(--font-label);font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:var(--capital-red)\">Shared portfolio space<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-family:var(--font-display);font-weight:300;font-size:31px;line-height:1.14;margin-top:14px\"><span class=\"rv\">Diversifying bonds<span class=\"rv-card\">Fixed income and the debasement basket are natural neighbours: both are funded from the same non-equity capital, and each diversifies a risk the other is exposed to.<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid var(--grey-200);padding-top:22px\">\n        <div style=\"display:flex;align-items:baseline;gap:14px\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:34px;line-height:1;color:var(--capital-red)\">02<\u002Fspan>\n          <span style=\"font-family:var(--font-label);font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:var(--capital-red)\">A single risk budget<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-family:var(--font-display);font-weight:300;font-size:31px;line-height:1.14;margin-top:14px\"><span class=\"rv\">One rates and inflation view<span class=\"rv-card\">Duration and scarcity are both priced off rates and inflation. One view drives both, so they are sized together rather than in isolation.<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid var(--grey-200);padding-top:22px\">\n        <div style=\"display:flex;align-items:baseline;gap:14px\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:34px;line-height:1;color:var(--capital-red)\">03<\u002Fspan>\n          <span style=\"font-family:var(--font-label);font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:var(--capital-red)\">Different coverage<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-family:var(--font-display);font-weight:300;font-size:31px;line-height:1.14;margin-top:14px\"><span class=\"rv\">Bonds for falling prices, the basket for a falling currency<span class=\"rv-card\">Bonds pay when growth and prices fall. The basket pays when the currency loses value. Holding both means the portfolio is covered whichever way the next shock runs.<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"18 Size to the mandate\" data-speaker-notes=\"The principle is the same; the size depends on par exposure.\" style=\"width:1920px;height:1080px;overflow:hidden;box-sizing:border-box;background:#fff;color:#000;font-family:Arial,sans-serif\">\n  <img src=\"2a5705b4-f1c6-4242-aebd-98c959fcc200\" alt=\"Cape Capital\" style=\"position:absolute;top:64px;left:64px;width:130px;z-index:10\">\n  <div style=\"position:absolute;top:66px;right:64px;font-family:var(--font-label);font-size:16px;letter-spacing:0.22em;text-transform:uppercase;color:var(--grey-800);z-index:10\">Internal only<\u002Fdiv>\n  <div style=\"position:absolute;bottom:48px;right:64px;font-family:var(--font-label);font-size:20px;letter-spacing:0.22em;color:var(--grey-800);z-index:10\">18<\u002Fdiv>\n  <div data-cite=\"\" style=\"position:absolute;bottom:46px;left:64px;right:220px;font-family:Arial,sans-serif;font-size:16px;line-height:1.4;color:#000;opacity:0.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Sources: Bloomberg, IMF Fiscal Monitor. Allocations illustrative; a standalone fixed-income mandate is not a Cape product.<\u002Fdiv>\n\n  <div style=\"padding:224px 64px 160px;height:100%;box-sizing:border-box;display:flex;flex-direction:column\">\n    <div style=\"margin-bottom:64px\">\n      <div style=\"width:56px;height:2px;background:var(--capital-red);margin:0 0 20px\"><\u002Fdiv>\n      <div style=\"font-family:Arial,sans-serif;font-size:18px;letter-spacing:0.22em;text-transform:uppercase;color:var(--capital-red);height:22px;line-height:22px;margin:0 0 22px;white-space:nowrap;overflow:hidden\">The execution<\u002Fdiv>\n      <h1 style=\"font-family:var(--font-display);font-weight:300;font-size:56px;letter-spacing:-0.025em;line-height:60px;height:60px;margin:0;white-space:nowrap;color:#000\">Size the basket to the mandate<\u002Fh1>\n      <p style=\"font-family:Arial,sans-serif;font-size:22px;line-height:32px;height:32px;color:var(--grey-800);margin:16px 0 0;white-space:nowrap\">Fixed income sits inside Balanced, so the basket is sized at 5% - <span class=\"rv\">equity absorbs the rest<span class=\"rv-card\">Listed equity carries pricing power, so part of the debasement is already captured in the equity allocation. A standalone fixed-income mandate would warrant ~20%.<\u002Fspan><\u002Fspan>.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"margin-bottom:44px\">\n<svg sc-camel-view-box=\"0 0 1792 300\" style=\"width:100%;max-height:300px;height:auto;display:block\" role=\"img\" aria-label=\"Balanced seventy thirty before and after the basket\">\n            <text x=\"0\" y=\"14\" font-family=\"PPRadioGrotesk, Arial, sans-serif\" font-weight=\"700\" font-size=\"12\" letter-spacing=\"2.2\" fill=\"var(--grey-800)\">CAPE BALANCED · BEFORE<\u002Ftext>\n            <g transform=\"translate(0,28)\">\n              <rect data-rv-bar=\"\" style=\"animation-delay:0.40s;transform-origin:left center\" x=\"0\" y=\"0\" width=\"1248\" height=\"56\" fill=\"var(--grey-300)\"><\u002Frect><text x=\"22\" y=\"34\" font-family=\"PPRadioGrotesk, Arial, sans-serif\" font-weight=\"700\" font-size=\"14\" letter-spacing=\"1.6\" fill=\"#000\">70% EQUITY<\u002Ftext>\n              <rect data-rv-bar=\"\" style=\"animation-delay:0.52s;transform-origin:left center\" x=\"1254\" y=\"0\" width=\"529\" height=\"56\" fill=\"var(--grey-200)\"><\u002Frect><text x=\"1276\" y=\"34\" font-family=\"PPRadioGrotesk, Arial, sans-serif\" font-weight=\"700\" font-size=\"14\" letter-spacing=\"1.6\" fill=\"#000\">30% FIXED INCOME<\u002Ftext>\n            <\u002Fg>\n            <text x=\"0\" y=\"130\" font-family=\"PPRadioGrotesk, Arial, sans-serif\" font-weight=\"700\" font-size=\"12\" letter-spacing=\"2.2\" fill=\"var(--capital-red)\">CAPE BALANCED · WITH THE BASKET<\u002Ftext>\n            <g transform=\"translate(0,144)\">\n              <rect data-rv-bar=\"\" style=\"animation-delay:0.40s;transform-origin:left center\" x=\"0\" y=\"0\" width=\"1248\" height=\"56\" fill=\"var(--grey-300)\"><\u002Frect><text x=\"22\" y=\"34\" font-family=\"PPRadioGrotesk, Arial, sans-serif\" font-weight=\"700\" font-size=\"14\" letter-spacing=\"1.6\" fill=\"#000\">70% EQUITY<\u002Ftext>\n              <rect data-rv-bar=\"\" style=\"animation-delay:0.52s;transform-origin:left center\" x=\"1254\" y=\"0\" width=\"440\" height=\"56\" fill=\"var(--red-500)\"><\u002Frect><text x=\"1276\" y=\"34\" font-family=\"PPRadioGrotesk, Arial, sans-serif\" font-weight=\"700\" font-size=\"14\" letter-spacing=\"1.6\" fill=\"#fff\">25% FIXED INCOME<\u002Ftext>\n              <rect data-rv-bar=\"\" style=\"animation-delay:0.64s;transform-origin:left center\" x=\"1700\" y=\"0\" width=\"83\" height=\"56\" fill=\"var(--capital-red)\"><\u002Frect><text x=\"1741.5\" y=\"34\" text-anchor=\"middle\" font-family=\"PPRadioGrotesk, Arial, sans-serif\" font-weight=\"700\" font-size=\"14\" fill=\"#fff\">5%<\u002Ftext>\n            <\u002Fg>\n            <g data-rv=\"\" style=\"animation-delay:1s\">\n              <path d=\"M1700,206 L1700,224 L1792,224\" fill=\"none\" stroke=\"var(--capital-red)\" stroke-width=\"1.6\"><\u002Fpath>\n              <text x=\"1792\" y=\"248\" text-anchor=\"end\" font-family=\"PPRadioGrotesk, Arial, sans-serif\" font-weight=\"700\" font-size=\"13\" letter-spacing=\"2\" fill=\"var(--capital-red)\">FUNDED FROM THE BOND ALLOCATION<\u002Ftext>\n              <text x=\"1792\" y=\"272\" text-anchor=\"end\" font-family=\"Arial, sans-serif\" font-size=\"15\" fill=\"var(--grey-800)\">the holdings most exposed to par redemption<\u002Ftext>\n            <\u002Fg>\n          <\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:76px\">\n      <div style=\"border-top:1px solid var(--grey-200);padding-top:20px\">\n        <div style=\"font-family:var(--font-label);font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:var(--capital-red)\">Where it comes from<\u002Fdiv>\n        <div style=\"font-family:var(--font-display);font-weight:300;font-size:30px;line-height:1.14;margin-top:12px\"><span class=\"rv\">The bond allocation<span class=\"rv-card\">Sourced from long-duration investment grade - the holdings whose par redemption is most exposed to debasement.<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid var(--grey-200);padding-top:20px\">\n        <div style=\"font-family:var(--font-label);font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:var(--capital-red)\">What 5% adds<\u002Fdiv>\n        <div style=\"font-family:var(--font-display);font-weight:300;font-size:30px;line-height:1.14;margin-top:12px\"><span class=\"rv\">Diversification where it is missing<span class=\"rv-card\">Adds a return driver the portfolio does not otherwise own, at a size that lifts real-asset coverage without changing the mandate’s risk profile. Listed equity already carries part of the debasement through pricing power, so 5% covers the residual.<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:3px solid var(--capital-red);padding-top:20px\">\n        <div style=\"font-family:var(--font-label);font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:var(--capital-red)\">Net effect<\u002Fdiv>\n        <div style=\"font-family:var(--font-display);font-weight:300;font-size:30px;line-height:1.14;margin-top:12px\"><span class=\"rv\">A meaningful real-asset claim<span class=\"rv-card\">Fixed income moves to 25% and the basket takes 5% - enough to matter at portfolio level without changing the risk profile of the mandate.<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"19 Implementation\" data-speaker-notes=\"Establish the exposure first; refine the structure as it scales.\" style=\"width:1920px;height:1080px;overflow:hidden;box-sizing:border-box;background:#fff;color:#000;font-family:Arial,sans-serif\">\n  <img src=\"2a5705b4-f1c6-4242-aebd-98c959fcc200\" alt=\"Cape Capital\" style=\"position:absolute;top:64px;left:64px;width:130px;z-index:10\">\n  <div style=\"position:absolute;top:66px;right:64px;font-family:var(--font-label);font-size:16px;letter-spacing:0.22em;text-transform:uppercase;color:var(--grey-800);z-index:10\">Internal only<\u002Fdiv>\n  <div style=\"position:absolute;bottom:48px;right:64px;font-family:var(--font-label);font-size:20px;letter-spacing:0.22em;color:var(--grey-800);z-index:10\">19<\u002Fdiv>\n  <div data-cite=\"\" style=\"position:absolute;bottom:46px;left:64px;right:220px;font-family:Arial,sans-serif;font-size:16px;line-height:1.4;color:#000;opacity:0.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Sources: issuer factsheets, Bloomberg, July 2026. Adjacent themes shown for context only - not currently in scope.<\u002Fdiv>\n\n  <div style=\"padding:224px 64px 160px;height:100%;box-sizing:border-box;display:flex;flex-direction:column\">\n    <div style=\"margin-bottom:64px\">\n      <div style=\"width:56px;height:2px;background:var(--capital-red);margin:0 0 20px\"><\u002Fdiv>\n      <div style=\"font-family:Arial,sans-serif;font-size:18px;letter-spacing:0.22em;text-transform:uppercase;color:var(--capital-red);height:22px;line-height:22px;margin:0 0 22px;white-space:nowrap;overflow:hidden\">The execution<\u002Fdiv>\n      <h1 style=\"font-family:var(--font-display);font-weight:300;font-size:56px;letter-spacing:-0.025em;line-height:60px;height:60px;margin:0;white-space:nowrap;color:#000\">Own the core first - the adjacent tracked, not owned<\u002Fh1>\n      <p style=\"font-family:Arial,sans-serif;font-size:22px;line-height:32px;height:32px;color:var(--grey-800);margin:16px 0 0;white-space:nowrap\">Many themes share the debasement driver; the core is where <span class=\"rv\">liquidity and pricing are clearest<span class=\"rv-card\">Gold, copper and bitcoin all have deep, continuously quoted markets with daily NAV and little valuation judgement. Farmland, timber and water rights are harder to mark.<\u002Fspan><\u002Fspan> today.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:0.82fr 1.18fr;gap:80px;align-items:start\">\n      <div>\n        <div style=\"font-family:var(--font-label);font-size:15px;letter-spacing:0.2em;text-transform:uppercase;color:var(--capital-red);border-bottom:2px solid var(--capital-red);padding-bottom:13px\">How we open the exposure<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:56px 1fr;gap:20px;padding:22px 0;border-bottom:1px solid var(--grey-100)\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:38px;line-height:1;color:var(--capital-red)\">1<\u002Fspan>\n          <span style=\"font-family:var(--font-display);font-weight:300;font-size:29px;line-height:1.14\"><span class=\"rv\">Physically-backed gold ETFs<span class=\"rv-card\">Spot-tracking, allocated and audited. Daily NAV, deep secondary liquidity, low total expense ratio.<\u002Fspan><\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:56px 1fr;gap:20px;padding:22px 0;border-bottom:1px solid var(--grey-100)\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:38px;line-height:1;color:var(--capital-red)\">2<\u002Fspan>\n          <span style=\"font-family:var(--font-display);font-weight:300;font-size:29px;line-height:1.14\"><span class=\"rv\">Copper mining equities<span class=\"rv-card\">Played through active copper-mining equity rather than a metal wrapper: operating leverage to the copper price plus a dividend, accepting equity-market beta as the trade-off.<\u002Fspan><\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:56px 1fr;gap:20px;padding:22px 0;border-bottom:1px solid var(--grey-100)\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:38px;line-height:1;color:var(--capital-red)\">3<\u002Fspan>\n          <span style=\"font-family:var(--font-display);font-weight:300;font-size:29px;line-height:1.14\"><span class=\"rv\">Regulated spot bitcoin ETFs<span class=\"rv-card\">No on-chain operations and no key management. Regulated, transparent and reversible.<\u002Fspan><\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"font-family:Arial,sans-serif;font-size:17px;line-height:1.55;color:var(--grey-800);margin:24px 0 0\">Establish the exposure first; <span class=\"rv\">refine the structure as it scales<span class=\"rv-card\">Roll strategies, tax placement and structured wrappers all add complexity and some may add return. None of them change the thesis, so none of them should delay it.<\u002Fspan><\u002Fspan>.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n<svg sc-camel-view-box=\"0 0 960 376\" style=\"width:100%;max-height:396px;height:auto;display:block\" role=\"img\" aria-label=\"The debasement core and adjacent scarcity themes\">\n            <text x=\"0\" y=\"14\" font-family=\"PPRadioGrotesk, Arial, sans-serif\" font-weight=\"700\" font-size=\"14\" letter-spacing=\"2.4\" fill=\"var(--grey-800)\">THE SCARCITY UNIVERSE · CORE AND ADJACENT<\u002Ftext>\n            <circle cx=\"403\" cy=\"188\" r=\"158\" fill=\"none\" stroke=\"var(--capital-red)\" stroke-width=\"1\" stroke-dasharray=\"2 9\" opacity=\"0.55\"><\u002Fcircle>\n            <g data-rv=\"\" style=\"animation-delay:0.90s\"><rect x=\"264.7\" y=\"48.5\" width=\"82.0\" height=\"30\" fill=\"#fff\" stroke=\"var(--grey-300)\" stroke-width=\"1\"><\u002Frect><text x=\"305.7\" y=\"68.5\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"15\" fill=\"var(--grey-800)\">Silver<\u002Ftext><\u002Fg>\n            <g data-rv=\"\" style=\"animation-delay:0.97s\"><rect x=\"407.0\" y=\"24.5\" width=\"100.0\" height=\"30\" fill=\"#fff\" stroke=\"var(--grey-300)\" stroke-width=\"1\"><\u002Frect><text x=\"457.0\" y
