\" y=\"52.5\" width=\"36\" height=\"71.5\" fill=\"var(--beige-400)\"><\u002Frect>\n            <text x=\"302\" y=\"69.5\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"12\" fill=\"#000\">5.5<\u002Ftext>\n            <text x=\"302\" y=\"143\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"12\" fill=\"var(--grey-800)\">UK<\u002Ftext>\n            <g font-family=\"Arial, sans-serif\" font-size=\"12\" fill=\"var(--grey-800)\"><text x=\"36\" y=\"38\" text-anchor=\"end\">8%<\u002Ftext><text x=\"36\" y=\"98\" text-anchor=\"end\">3%<\u002Ftext><\u002Fg>\n          <\u002Fsvg><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid var(--grey-200);padding-top:26px\">\n        <div style=\"display:flex;align-items:baseline;gap:4px\"><span style=\"font-family:var(--font-display);font-weight:300;font-size:80px;line-height:0.9;letter-spacing:-0.02em;color:#000\">+6.5<\u002Fspan><span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:42px;color:var(--capital-red)\">%<\u002Fspan><\u002Fdiv>\n        <div style=\"font-family:var(--font-label);font-size:16px;letter-spacing:0.18em;text-transform:uppercase;color:var(--capital-red);margin-top:12px;height:20px;white-space:nowrap;overflow:hidden\">M2 growth p.a. · vs +2.0% output<\u002Fdiv>\n        <div style=\"margin-top:30px\"><svg sc-camel-view-box=\"0 0 360 150\" style=\"width:100%;height:auto;display:block\" role=\"img\" aria-label=\"Money supply versus real output since 2000\">\n            <g stroke=\"var(--grey-100)\" stroke-width=\"1\"><line x1=\"42\" y1=\"34\" x2=\"352\" y2=\"34\"><\u002Fline><line x1=\"42\" y1=\"64\" x2=\"352\" y2=\"64\"><\u002Fline><line x1=\"42\" y1=\"94\" x2=\"352\" y2=\"94\"><\u002Fline><\u002Fg>\n            <g stroke=\"var(--grey-300)\" stroke-width=\"1.2\"><line x1=\"42\" y1=\"20\" x2=\"42\" y2=\"124\"><\u002Fline><line x1=\"42\" y1=\"124\" x2=\"352\" y2=\"124\"><\u002Fline><\u002Fg>\n            <path data-rv-line=\"\" style=\"animation-delay:.35s\" fill=\"none\" stroke=\"var(--grey-400)\" stroke-width=\"2.5\" stroke-linecap=\"round\" d=\"M42,118 C112,114 182,108 252,100 C298,95 330,91 352,88\"><\u002Fpath>\n            <path data-rv-line=\"\" style=\"animation-delay:.55s\" fill=\"none\" stroke=\"var(--capital-red)\" stroke-width=\"3\" stroke-linecap=\"round\" d=\"M42,118 C112,102 182,78 252,54 C298,40 330,30 352,24\"><\u002Fpath>\n            <circle data-rv=\"\" style=\"animation-delay:.85s\" cx=\"352\" cy=\"24\" r=\"5\" fill=\"var(--capital-red)\"><\u002Fcircle>\n            <circle data-rv=\"\" style=\"animation-delay:.85s\" cx=\"352\" cy=\"88\" r=\"4\" fill=\"var(--grey-400)\"><\u002Fcircle>\n            <g font-family=\"Arial, sans-serif\" font-size=\"12\">\n              <rect x=\"56\" y=\"17\" width=\"14\" height=\"3\" fill=\"var(--capital-red)\"><\u002Frect><text x=\"76\" y=\"22\" fill=\"var(--capital-red)\">M2 · 8.5x<\u002Ftext>\n              <rect x=\"56\" y=\"47\" width=\"14\" height=\"3\" fill=\"var(--grey-400)\"><\u002Frect><text x=\"76\" y=\"52\" fill=\"var(--grey-800)\">output · 2.5x<\u002Ftext>\n              <text x=\"42\" y=\"143\" fill=\"var(--grey-800)\">2000<\u002Ftext><text x=\"352\" y=\"143\" text-anchor=\"end\" fill=\"var(--grey-800)\">2026<\u002Ftext><\u002Fg>\n          <\u002Fsvg><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"04 Routes out of debt\" data-speaker-notes=\"If real rates cannot clear, real assets must.\" style=\"width:1920px;height:1080px;overflow:hidden;box-sizing:border-box;background:#fff;color:#000;font-family:Arial,sans-serif\">\n  <img src=\"2a5705b4-f1c6-4242-aebd-98c959fcc200\" alt=\"Cape Capital\" style=\"position:absolute;top:64px;left:64px;width:130px;z-index:10\">\n  <div style=\"position:absolute;top:66px;right:64px;font-family:var(--font-label);font-size:16px;letter-spacing:0.22em;text-transform:uppercase;color:var(--grey-800);z-index:10\">Internal only<\u002Fdiv>\n  <div style=\"position:absolute;bottom:48px;right:64px;font-family:var(--font-label);font-size:20px;letter-spacing:0.22em;color:var(--grey-800);z-index:10\">04<\u002Fdiv>\n  <div data-cite=\"\" style=\"position:absolute;bottom:46px;left:64px;right:220px;font-family:Arial,sans-serif;font-size:16px;line-height:1.4;color:#000;opacity:0.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Sources: IMF research on debt-reduction episodes, OECD, CBO Long-Term Budget Outlook, national data.<\u002Fdiv>\n\n  <div style=\"padding:224px 64px 160px;height:100%;box-sizing:border-box;display:flex;flex-direction:column\">\n    <div style=\"margin-bottom:64px\">\n      <div style=\"width:56px;height:2px;background:var(--capital-red);margin:0 0 20px\"><\u002Fdiv>\n      <div style=\"font-family:Arial,sans-serif;font-size:18px;letter-spacing:0.22em;text-transform:uppercase;color:var(--capital-red);height:22px;line-height:22px;margin:0 0 22px;white-space:nowrap;overflow:hidden\">The challenge<\u002Fdiv>\n      <h1 style=\"font-family:var(--font-display);font-weight:300;font-size:56px;letter-spacing:-0.025em;line-height:60px;height:60px;margin:0;white-space:nowrap;color:#000\">Several routes out of debt - one is rarely taken<\u002Fh1>\n      <p style=\"font-family:Arial,sans-serif;font-size:22px;line-height:32px;height:32px;color:var(--grey-800);margin:16px 0 0;white-space:nowrap\">Austerity is the rare exception; more often the currency carries the adjustment. <span class=\"rv\">Five of the last six<span class=\"rv-card\">Of the last six large increases in government debt, only one was ever resolved by sustained austerity. The other five let the currency carry the adjustment.<\u002Fspan><\u002Fspan> went that way.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:0.72fr 1.28fr;gap:80px;align-items:start\">\n      <div style=\"border-left:4px solid var(--capital-red);padding:4px 0 4px 26px\">\n        <div style=\"font-family:var(--font-label);font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:var(--deep-blue);margin-bottom:14px\">Of the last six big rises in government debt<\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:16px\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-size:82px;line-height:1;color:var(--capital-red);white-space:nowrap\">1 in 6<\u002Fspan>\n          <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:23px;color:var(--grey-800);line-height:1.15\">was ever fixed by<br>real austerity<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin-top:24px\"><svg sc-camel-view-box=\"0 0 300 190\" style=\"width:100%;max-width:340px;height:auto;display:block\" role=\"img\" aria-label=\"One in six debt episodes was resolved by austerity\">\n            <g data-rv=\"\" style=\"animation-delay:.5s\"><circle cx=\"16\" cy=\"14\" r=\"9\" fill=\"var(--beige-400)\"><\u002Fcircle><circle cx=\"62\" cy=\"14\" r=\"9\" fill=\"var(--capital-red)\"><\u002Fcircle><circle cx=\"108\" cy=\"14\" r=\"9\" fill=\"var(--beige-400)\"><\u002Fcircle><circle cx=\"154\" cy=\"14\" r=\"9\" fill=\"var(--beige-400)\"><\u002Fcircle><circle cx=\"200\" cy=\"14\" r=\"9\" fill=\"var(--beige-400)\"><\u002Fcircle><circle cx=\"246\" cy=\"14\" r=\"9\" fill=\"var(--beige-400)\"><\u002Fcircle><circle cx=\"16\" cy=\"50\" r=\"9\" fill=\"var(--beige-400)\"><\u002Fcircle><circle cx=\"62\" cy=\"50\" r=\"9\" fill=\"var(--capital-red)\"><\u002Fcircle><circle cx=\"108\" cy=\"50\" r=\"9\" fill=\"var(--beige-400)\"><\u002Fcircle><circle cx=\"154\" cy=\"50\" r=\"9\" fill=\"var(--beige-400)\"><\u002Fcircle><circle cx=\"200\" cy=\"50\" r=\"9\" fill=\"var(--beige-400)\"><\u002Fcircle><circle cx=\"246\" cy=\"50\" r=\"9\" fill=\"var(--beige-400)\"><\u002Fcircle><circle cx=\"16\" cy=\"86\" r=\"9\" fill=\"var(--capital-red)\"><\u002Fcircle><circle cx=\"62\" cy=\"86\" r=\"9\" fill=\"var(--beige-400)\"><\u002Fcircle><circle cx=\"108\" cy=\"86\" r=\"9\" fill=\"var(--beige-400)\"><\u002Fcircle><circle cx=\"154\" cy=\"86\" r=\"9\" fill=\"var(--beige-400)\"><\u002Fcircle><circle cx=\"200\" cy=\"86\" r=\"9\" fill=\"var(--beige-400)\"><\u002Fcircle><circle cx=\"246\" cy=\"86\" r=\"9\" fill=\"var(--beige-400)\"><\u002Fcircle><circle cx=\"16\" cy=\"122\" r=\"9\" fill=\"var(--capital-red)\"><\u002Fcircle><circle cx=\"62\" cy=\"122\" r=\"9\" fill=\"var(--beige-400)\"><\u002Fcircle><circle cx=\"108\" cy=\"122\" r=\"9\" fill=\"var(--beige-400)\"><\u002Fcircle><circle cx=\"154\" cy=\"122\" r=\"9\" fill=\"var(--beige-400)\"><\u002Fcircle><circle cx=\"200\" cy=\"122\" r=\"9\" fill=\"var(--beige-400)\"><\u002Fcircle><circle cx=\"246\" cy=\"122\" r=\"9\" fill=\"var(--beige-400)\"><\u002Fcircle><circle cx=\"16\" cy=\"158\" r=\"9\" fill=\"var(--capital-red)\"><\u002Fcircle><circle cx=\"62\" cy=\"158\" r=\"9\" fill=\"var(--beige-400)\"><\u002Fcircle><circle cx=\"108\" cy=\"158\" r=\"9\" fill=\"var(--beige-400)\"><\u002Fcircle><circle cx=\"154\" cy=\"158\" r=\"9\" fill=\"var(--beige-400)\"><\u002Fcircle><circle cx=\"200\" cy=\"158\" r=\"9\" fill=\"var(--beige-400)\"><\u002Fcircle><circle cx=\"246\" cy=\"158\" r=\"9\" fill=\"var(--beige-400)\"><\u002Fcircle><\u002Fg>\n          <\u002Fsvg><\u002Fdiv>\n        <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);line-height:1.5;margin-top:16px\"><span style=\"color:var(--capital-red)\">Red<\u002Fspan> = the rare durable turnarounds. <span class=\"rv\">Each cost years of pain<span class=\"rv-card\">Sweden, Canada, New Zealand, Ireland and Chile each ran multi-year primary surpluses with real spending cuts - politically survivable only under acute crisis conditions.<\u002Fspan><\u002Fspan>.<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n<svg sc-camel-view-box=\"0 0 996 300\" style=\"width:100%;max-height:330px;height:auto;display:block\" role=\"img\" aria-label=\"The spectrum from austerity to debasement, and where the leading economies sit today\">\n            <defs><linearGradient id=\"specG\" x1=\"0.0\" y1=\"0\" x2=\"1.1\" y2=\"0\"><stop offset=\"0%\" stop-color=\"#828010\"><\u002Fstop><stop offset=\"52%\" stop-color=\"#C66A37\"><\u002Fstop><stop offset=\"100%\" stop-color=\"#831011\"><\u002Fstop><\u002FlinearGradient><\u002Fdefs>\n            <text x=\"0.0\" y=\"16\" font-family=\"PPRadioGrotesk, Arial, sans-serif\" font-weight=\"700\" font-size=\"13\" letter-spacing=\"2.4\" fill=\"var(--grey-800)\">THE ROUTES OUT OF DEBT<\u002Ftext>\n            <text x=\"520.1\" y=\"60\" text-anchor=\"middle\" font-family=\"PPRadioGrotesk, Arial, sans-serif\" font-weight=\"700\" font-size=\"14\" letter-spacing=\"2\" fill=\"#C66A37\">SOFT DEBASEMENT<\u002Ftext>\n            <text x=\"520.1\" y=\"82\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"14\" fill=\"#C66A37\">mild inflation, repressed real rates<\u002Ftext>\n            <rect data-rv-bar=\"\" style=\"animation-delay:.4s\" x=\"22.1\" y=\"104\" width=\"951.7\" height=\"14\" rx=\"7\" fill=\"url(#specG)\"><\u002Frect>\n            <text x=\"22.1\" y=\"60\" font-family=\"PPRadioGrotesk, Arial, sans-serif\" font-weight=\"700\" font-size=\"14\" fill=\"#828010\">HARD AUSTERITY<\u002Ftext>\n            <text x=\"22.1\" y=\"82\" font-family=\"Arial, sans-serif\" font-size=\"14\" fill=\"var(--grey-800)\">the budget pays · rare<\u002Ftext>\n            <text x=\"973.9\" y=\"60\" text-anchor=\"end\" font-family=\"PPRadioGrotesk, Arial, sans-serif\" font-weight=\"700\" font-size=\"14\" fill=\"var(--capital-red)\">HARD DEBASEMENT<\u002Ftext>\n            <text x=\"973.9\" y=\"82\" text-anchor=\"end\" font-family=\"Arial, sans-serif\" font-size=\"14\" fill=\"var(--grey-800)\">the saver pays · common<\u002Ftext>\n            <circle cx=\"101.8\" cy=\"111\" r=\"7\" fill=\"#828010\"><\u002Fcircle>\n            <text x=\"101.8\" y=\"146\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"14\" fill=\"var(--grey-800)\">Sweden, Ireland<\u002Ftext>\n            <circle cx=\"898.6\" cy=\"111\" r=\"7\" fill=\"var(--capital-red)\"><\u002Fcircle>\n            <text x=\"898.6\" y=\"146\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"14\" fill=\"var(--grey-800)\">Argentina, Turkey<\u002Ftext>\n            <g data-rv=\"\" style=\"animation-delay:.85s\">\n              <circle cx=\"520.1\" cy=\"111\" r=\"16\" fill=\"none\" stroke=\"var(--capital-red)\" stroke-width=\"2.2\" opacity=\"0.4\"><\u002Fcircle>\n              <circle cx=\"520.1\" cy=\"111\" r=\"10\" fill=\"var(--capital-red)\"><\u002Fcircle>\n              <line x1=\"520.1\" y1=\"127\" x2=\"520.1\" y2=\"170\" stroke=\"var(--capital-red)\" stroke-width=\"1.3\"><\u002Fline>\n              <text x=\"520.1\" y=\"212\" text-anchor=\"middle\" font-family=\"PPEiko, Georgia, serif\" font-weight=\"300\" font-size=\"36\" fill=\"var(--capital-red)\">US · Japan · Euro area<\u002Ftext>\n              <text x=\"520.1\" y=\"242\" text-anchor=\"middle\" font-family=\"PPRadioGrotesk, Arial, sans-serif\" font-weight=\"700\" font-size=\"14\" letter-spacing=\"2.6\" fill=\"var(--grey-800)\">WHERE THE LEADING ECONOMIES SIT TODAY<\u002Ftext>\n              <line x1=\"320.9\" y1=\"264\" x2=\"719.3\" y2=\"264\" stroke=\"var(--capital-red)\" stroke-width=\"1.1\"><\u002Fline>\n              <text x=\"520.1\" y=\"290\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-size=\"15\" fill=\"var(--grey-800)\">The cost moves gradually from the budget to the saver.<\u002Ftext>\n            <\u002Fg>\n          <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"05 Regime matrix\" data-speaker-notes=\"The 60/40 was forged in the top-left. We are bottom-right.\" style=\"width:1920px;height:1080px;overflow:hidden;box-sizing:border-box;background:#fff;color:#000;font-family:Arial,sans-serif\">\n  <img src=\"2a5705b4-f1c6-4242-aebd-98c959fcc200\" alt=\"Cape Capital\" style=\"position:absolute;top:64px;left:64px;width:130px;z-index:10\">\n  <div style=\"position:absolute;top:66px;right:64px;font-family:var(--font-label);font-size:16px;letter-spacing:0.22em;text-transform:uppercase;color:var(--grey-800);z-index:10\">Internal only<\u002Fdiv>\n  <div style=\"position:absolute;bottom:48px;right:64px;font-family:var(--font-label);font-size:20px;letter-spacing:0.22em;color:var(--grey-800);z-index:10\">05<\u002Fdiv>\n  <div data-cite=\"\" style=\"position:absolute;bottom:46px;left:64px;right:220px;font-family:Arial,sans-serif;font-size:16px;line-height:1.4;color:#000;opacity:0.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Sources: Federal Reserve, BLS, US Treasury, BIS Quarterly Review. Regime classification stylised, boundaries illustrative.<\u002Fdiv>\n\n  <div style=\"padding:224px 64px 160px;height:100%;box-sizing:border-box;display:flex;flex-direction:column\">\n    <div style=\"margin-bottom:64px\">\n      <div style=\"width:56px;height:2px;background:var(--capital-red);margin:0 0 20px\"><\u002Fdiv>\n      <div style=\"font-family:Arial,sans-serif;font-size:18px;letter-spacing:0.22em;text-transform:uppercase;color:var(--capital-red);height:22px;line-height:22px;margin:0 0 22px;white-space:nowrap;overflow:hidden\">The challenge<\u002Fdiv>\n      <h1 style=\"font-family:var(--font-display);font-weight:300;font-size:56px;letter-spacing:-0.025em;line-height:60px;height:60px;margin:0;white-space:nowrap;color:#000\">Where that route leaves each asset class<\u002Fh1>\n      <p style=\"font-family:Arial,sans-serif;font-size:22px;line-height:32px;height:32px;color:var(--grey-800);margin:16px 0 0;white-space:nowrap\">The routes mapped against realised inflation and the real rate the <span class=\"rv\">political system can sustain<span class=\"rv-card\">At ~125% debt-to-GDP the clearing real rate and the politically survivable real rate are no longer the same number. The gap between them is the debasement.<\u002Fspan><\u002Fspan>.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:186px 1fr 1fr;gap:6px 26px;align-content:start\">\n      <span><\u002Fspan>\n      <span style=\"font-family:var(--font-label);font-size:14px;letter-spacing:0.2em;text-transform:uppercase;color:var(--grey-800);border-bottom:1px solid var(--grey-200);padding-bottom:8px\">Low inflation · below ~2.5%<\u002Fspan>\n      <span style=\"font-family:var(--font-label);font-size:14px;letter-spacing:0.2em;text-transform:uppercase;color:var(--capital-red);border-bottom:2px solid var(--capital-red);padding-bottom:8px\">High inflation · above ~2.5%<\u002Fspan>\n\n      <span style=\"font-family:var(--font-label);font-size:14px;letter-spacing:0.2em;text-transform:uppercase;color:var(--grey-800);align-self:center;line-height:1.5\">Positive<br>real rates<\u002Fspan>\n      <div style=\"border:1px solid var(--grey-200);border-top:3px solid var(--grey-300);padding:11px 20px 12px;position:relative;background:#fff\">\n        \n        <div style=\"font-family:var(--font-label);font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--grey-800);height:16px\">Regime A · 1985-2020<\u002Fdiv>\n        <div style=\"font-family:var(--font-display);font-weight:300;font-size:26px;line-height:1.05;margin-top:6px;height:52px\">The bond era<\u002Fdiv>\n        <div style=\"font-family:Arial,sans-serif;font-size:16px;line-height:1.5;color:var(--grey-800);margin-top:2px\"><span class=\"rv\">Bonds did two jobs<span class=\"rv-card\">Yield and ballast from the same instrument. Duration paid you to hold it and rallied when equities fell - the conditions the 60/40 was built on.<\u002Fspan><\u002Fspan><\u002Fdiv>\n        \n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:12px\"><span style=\"font-family:var(--font-label);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;padding:6px 11px;border:1px solid var(--grey-300);color:var(--grey-800)\">Bonds win<\u002Fspan><span style=\"font-family:var(--font-label);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;padding:6px 11px;border:1px solid var(--grey-300);color:var(--grey-800)\">Cash works<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid var(--grey-200);border-top:3px solid var(--grey-300);padding:11px 20px 12px;position:relative;background:#fff\">\n        \n        <div style=\"font-family:var(--font-label);font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--grey-800);height:16px\">Regime B · 1980-84<\u002Fdiv>\n        <div style=\"font-family:var(--font-display);font-weight:300;font-size:26px;line-height:1.05;margin-top:6px;height:52px\">Volcker squeeze<\u002Fdiv>\n        <div style=\"font-family:Arial,sans-serif;font-size:16px;line-height:1.5;color:var(--grey-800);margin-top:2px\"><span class=\"rv\">Not available today<span class=\"rv-card\">Real rates above +5% broke inflation. Cash won first; once yields peaked in 1981-82 long bonds delivered one of the great rallies. At ~125% debt-to-GDP the same policy would break the sovereign.<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <div style=\"height:18px\"><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:12px\"><span style=\"font-family:var(--font-label);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;padding:6px 11px;border:1px solid var(--grey-300);color:var(--grey-800)\">Bonds rally from 1982<\u002Fspan><span style=\"font-family:var(--font-label);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;padding:6px 11px;border:1px solid var(--grey-300);color:var(--grey-800)\">Gold corrects<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <span style=\"font-family:var(--font-label);font-size:14px;letter-spacing:0.2em;text-transform:uppercase;color:var(--grey-800);align-self:center;line-height:1.5\">Real rates below<br>stabilising level<\u002Fspan>\n      <div style=\"border:1px solid var(--grey-200);border-top:3px solid var(--grey-300);padding:11px 20px 12px;position:relative;background:#fff\">\n        \n        <div style=\"font-family:var(--font-label);font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--grey-800);height:16px\">Regime C · 2010-2019<\u002Fdiv>\n        <div style=\"font-family:var(--font-display);font-weight:300;font-size:26px;line-height:1.05;margin-top:6px;height:52px\">Silent debasement<\u002Fdiv>\n        <div style=\"font-family:Arial,sans-serif;font-size:16px;line-height:1.5;color:var(--grey-800);margin-top:2px\"><span class=\"rv\">The bill arrived later<span class=\"rv-card\">QE running and real rates negative. Bonds still delivered nominal returns while the real cost accrued quietly to the holder.<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <div style=\"height:18px\"><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:12px\"><span style=\"font-family:var(--font-label);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;padding:6px 11px;border:1px solid var(--grey-300);color:var(--grey-800)\">Gold outperforms<\u002Fspan><span style=\"font-family:var(--font-label);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;padding:6px 11px;border:1px solid var(--grey-300);color:var(--grey-800)\">Equities expand<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div data-rv-glow=\"\" style=\"border:1px solid var(--capital-red);border:2px solid var(--capital-red);border-top:8px solid var(--capital-red);background:var(--beige-100);padding:16px 24px 18px;position:relative;box-shadow:0 6px 26px rgba(131,16,17,0.20);transform:scale(1.035);transform-origin:center\">\n        <div data-rv-glow=\"\" style=\"position:absolute;top:-16px;left:24px;background:var(--capital-red);color:#fff;font-family:var(--font-label);font-size:16px;letter-spacing:0.24em;text-transform:uppercase;padding:11px 22px;box-shadow:0 4px 14px rgba(131,16,17,0.35)\">Where we are today<\u002Fdiv>\n        <div style=\"font-family:var(--font-label);font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--capital-red);height:16px\">Regime D · 2022-today<\u002Fdiv>\n        <div style=\"font-family:var(--font-display);font-weight:300;font-size:34px;line-height:1.04;margin-top:14px;height:64px;color:var(--capital-red)\">Fiscal dominance, visible debasement<\u002Fdiv>\n        <div style=\"font-family:Arial,sans-serif;font-size:16px;line-height:1.5;color:var(--grey-800);margin-top:2px\"><span class=\"rv\">Persistent and policy-driven<span class=\"rv-card\">CPI at 3-4% with real rates below the level that stabilises the debt path. This is not a cyclical overshoot - it is the arithmetic of the fiscal position.<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <div style=\"height:18px\"><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:12px\"><span style=\"font-family:var(--font-label);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;padding:6px 11px;background:var(--capital-red);color:#fff\">Gold + BTC win<\u002Fspan><span style=\"font-family:var(--font-label);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;padding:6px 11px;border:1px solid var(--capital-red);color:var(--capital-red)\">Bonds bleed<\u002Fspan><span style=\"font-family:var(--font-label);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;padding:6px 11px;border:1px solid var(--capital-red);color:var(--capital-red)\">Real assets bid<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"06 Four words\" data-speaker-notes=\"Gold lives in the gap between rates and inflation.\" style=\"width:1920px;height:1080px;overflow:hidden;box-sizing:border-box;background:#fff;color:#000;font-family:Arial,sans-serif\">\n  <img src=\"2a5705b4-f1c6-4242-aebd-98c959fcc200\" alt=\"Cape Capital\" style=\"position:absolute;top:64px;left:64px;width:130px;z-index:10\">\n  <div style=\"position:absolute;top:66px;right:64px;font-family:var(--font-label);font-size:16px;letter-spacing:0.22em;text-transform:uppercase;color:var(--grey-800);z-index:10\">Internal only<\u002Fdiv>\n  <div style=\"position:absolute;bottom:48px;right:64px;font-family:var(--font-label);font-size:20px;letter-spacing:0.22em;color:var(--grey-800);z-index:10\">06<\u002Fdiv>\n  <div data-cite=\"\" style=\"position:absolute;bottom:46px;left:64px;right:220px;font-family:Arial,sans-serif;font-size:16px;line-height:1.4;color:#000;opacity:0.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Sources: US Treasury, Federal Reserve (10y TIPS), BLS CPI-U (June 2026), LBMA. As at 29 July 2026.<\u002Fdiv>\n\n  <div style=\"padding:224px 64px 160px;height:100%;box-sizing:border-box;display:flex;flex-direction:column\">\n    <div style=\"margin-bottom:64px\">\n      <div style=\"width:56px;height:2px;background:var(--capital-red);margin:0 0 20px\"><\u002Fdiv>\n      <div style=\"font-family:Arial,sans-serif;font-size:18px;letter-spacing:0.22em;text-transform:uppercase;color:var(--capital-red);height:22px;line-height:22px;margin:0 0 22px;white-space:nowrap;overflow:hidden\">The challenge<\u002Fdiv>\n      <h1 style=\"font-family:var(--font-display);font-weight:300;font-size:56px;letter-spacing:-0.025em;line-height:60px;height:60px;margin:0;white-space:nowrap;color:#000\">The real rate says ~+1%. Does the saver earn it?<\u002Fh1>\n      <p style=\"font-family:Arial,sans-serif;font-size:22px;line-height:32px;height:32px;color:var(--grey-800);margin:16px 0 0;white-space:nowrap\">No: reported CPI understates what households actually pay, and that gap is the debasement.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:24px\">\n      <div style=\"display:grid;grid-template-columns:1fr 92px 1fr;gap:0;align-items:stretch\">\n        <div data-rv=\"\" style=\"border-top:1px solid var(--grey-300);padding:22px 30px 24px\">\n          <div style=\"font-family:var(--font-label);font-size:13px;letter-spacing:0.2em;text-transform:uppercase;color:var(--grey-800)\">What the statistics say<\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;gap:16px;margin-top:14px\">\n            <span style=\"font-family:var(--font-display);font-weight:300;font-size:104px;line-height:0.9;letter-spacing:-0.03em;color:var(--grey-800)\">~+1%<\u002Fspan>\n            <span style=\"font-family:Arial,sans-serif;font-size:17px;line-height:1.4;color:var(--grey-800)\">real yield on<br>short-dated paper<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;margin-top:22px;font-family:Arial,sans-serif;font-size:17px;color:var(--grey-800)\">\n            <span>~3.5% short rates<\u002Fspan><span style=\"color:var(--grey-400)\">−<\u002Fspan><span>~2.5% <span class=\"rv\">reported CPI<span class=\"rv-card\">CPI-U prices a fixed statistical basket. The BLS states it does not necessarily measure any individual household’s own experience.<\u002Fspan><\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:18px;font-family:var(--font-display);font-weight:300;font-style:italic;font-size:24px;color:var(--grey-800)\">On paper, adequate.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:center\"><span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:30px;color:var(--capital-red)\">but<\u002Fspan><\u002Fdiv>\n        <div data-rv=\"\" data-rv-glow=\"\" style=\"animation-delay:.15s;border-top:3px solid var(--capital-red);background:var(--beige-100);padding:22px 30px 24px\">\n          <div style=\"font-family:var(--font-label);font-size:13px;letter-spacing:0.2em;text-transform:uppercase;color:var(--capital-red)\">What the holder actually earns<\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;gap:16px;margin-top:14px\">\n            <span style=\"font-family:var(--font-display);font-weight:300;font-size:104px;line-height:0.9;letter-spacing:-0.03em;color:var(--capital-red)\">~−1%<\u002Fspan>\n            <span style=\"font-family:Arial,sans-serif;font-size:17px;line-height:1.4;color:var(--grey-800)\">purchasing power<br>on the same bond<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;margin-top:22px;font-family:Arial,sans-serif;font-size:17px;color:var(--grey-800)\">\n            <span>~3.5% short rates<\u002Fspan><span style=\"color:var(--capital-red)\">−<\u002Fspan><span style=\"color:var(--capital-red)\">~4.5% <span class=\"rv\">transacted inflation<span class=\"rv-card\">The price actually paid on rent, food, insurance and the cost of money - the household’s real basket, which runs materially above reported CPI.<\u002Fspan><\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:18px;font-family:var(--font-display);font-weight:300;font-style:italic;font-size:24px;color:var(--capital-red)\">In practice, losing ground.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.3fr 1fr;gap:56px;border-top:1px solid var(--grey-200);padding-top:20px\">\n        <div style=\"font-family:Arial,sans-serif;font-size:19px;line-height:1.55;color:var(--grey-800)\">The gap between the two numbers is the debasement, and it does not appear in any official series. <span class=\"rv\">Why the state prefers it<span class=\"rv-card\">Nominal inflation lifts tax receipts while quietly eroding the real value of fixed-rate debt. No legislation required, no vote taken.<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:flex-end;gap:18px\">\n          <span style=\"font-family:Arial,sans-serif;font-size:16px;line-height:1.4;color:var(--grey-800);text-align:right\">The dollar measured<br>against gold, five years<\u002Fspan>\n          <span style=\"font-family:var(--font-display);font-weight:300;font-size:62px;line-height:1;color:var(--capital-red)\">~−35%<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"07 Divider - building the basket\" data-speaker-notes=\"The concept: legs, weights, mandate. Gold is the worked example - it has the longest record.\" style=\"width:1920px;height:1080px;overflow:hidden;box-sizing:border-box;background:var(--deep-red);color:#fff;font-family:Arial,sans-serif\">\n  <img src=\"e0ad9ade-68b1-416e-9811-ccebd51935fb\" alt=\"Cape Capital\" style=\"position:absolute;top:64px;left:64px;width:130px;z-index:10\">\n  <div style=\"position:absolute;top:66px;right:64px;font-family:var(--font-label);font-size:16px;letter-spacing:0.22em;text-transform:uppercase;color:#fff;z-index:10\">Internal only<\u002Fdiv>\n  <div style=\"position:absolute;bottom:48px;right:64px;font-family:var(--font-label);font-size:20px;letter-spacing:0.22em;color:#fff;z-index:10\">07<\u002Fdiv>\n\n  <div style=\"padding:224px 64px 200px;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center\">\n    <div style=\"width:56px;height:2px;background:#fff;margin:0 0 20px\"><\u002Fdiv>\n    <div style=\"font-family:Arial,sans-serif;font-size:18px;letter-spacing:0.22em;text-transform:uppercase;color:#fff;margin-bottom:30px\">The response<\u002Fdiv>\n    <h1 style=\"font-family:var(--font-display);font-weight:300;font-size:100px;letter-spacing:-0.03em;line-height:1.0;margin:0;color:#fff;white-space:nowrap\">Building the <em style=\"font-style:italic\">basket<\u002Fem><\u002Fh1>\n    <p style=\"font-family:Arial,sans-serif;font-size:26px;line-height:36px;color:#fff;margin:40px 0 0;white-space:nowrap\">What the basket must do, what sits in it, and how the legs are weighted.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"08 The role\" data-speaker-notes=\"An honest definition of the mandate and its limits.\" style=\"width:1920px;height:1080px;overflow:hidden;box-sizing:border-box;background:#fff;color:#000;font-family:Arial,sans-serif\">\n  <img src=\"2a5705b4-f1c6-4242-aebd-98c959fcc200\" alt=\"Cape Capital\" style=\"position:absolute;top:64px;left:64px;width:130px;z-index:10\">\n  <div style=\"position:absolute;top:66px;right:64px;font-family:var(--font-label);font-size:16px;letter-spacing:0.22em;text-transform:uppercase;color:var(--grey-800);z-index:10\">Internal only<\u002Fdiv>\n  <div style=\"position:absolute;bottom:48px;right:64px;font-family:var(--font-label);font-size:20px;letter-spacing:0.22em;color:var(--grey-800);z-index:10\">08<\u002Fdiv>\n  <div data-cite=\"\" style=\"position:absolute;bottom:46px;left:64px;right:220px;font-family:Arial,sans-serif;font-size:16px;line-height:1.4;color:#000;opacity:0.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Sources: Bloomberg, LBMA, BIS. Drawdowns reference March 2020 and September 2022.<\u002Fdiv>\n\n  <div style=\"padding:224px 64px 160px;height:100%;box-sizing:border-box;display:flex;flex-direction:column\">\n    <div style=\"margin-bottom:64px\">\n      <div style=\"width:56px;height:2px;background:var(--capital-red);margin:0 0 20px\"><\u002Fdiv>\n      <div style=\"font-family:Arial,sans-serif;font-size:18px;letter-spacing:0.22em;text-transform:uppercase;color:var(--capital-red);height:22px;line-height:22px;margin:0 0 22px;white-space:nowrap;overflow:hidden\">The response<\u002Fdiv>\n      <h1 style=\"font-family:var(--font-display);font-weight:300;font-size:56px;letter-spacing:-0.025em;line-height:60px;height:60px;margin:0;white-space:nowrap;color:#000\">The mandate - and its limits<\u002Fh1>\n      <p style=\"font-family:Arial,sans-serif;font-size:22px;line-height:32px;height:32px;color:var(--grey-800);margin:16px 0 0;white-space:nowrap\">A precise instrument for <span class=\"rv\">monetary dilution<span class=\"rv-card\">Sustained loss of currency purchasing power against scarce assets - measured over years, not quarters. This is the exposure the basket is built for.<\u002Fspan><\u002Fspan> sustained over years.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:0;align-items:stretch\">\n      <div style=\"background:var(--deep-red);padding:32px 44px 36px\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:1px solid rgba(255,255,255,0.28);padding-bottom:14px\">\n          <span style=\"font-family:var(--font-label);font-size:15px;letter-spacing:0.2em;text-transform:uppercase;color:#fff\">What it is built to do<\u002Fspan>\n          <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:22px;color:#fff;opacity:0.75\">the mandate<\u002Fspan>\n        <\u002Fdiv>\n        <div data-rv=\"\" style=\"animation-delay:0.10s;display:grid;grid-template-columns:58px 1fr;gap:22px;align-items:baseline;padding:26px 0;border-bottom:1px solid rgba(255,255,255,0.14)\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:40px;line-height:1;color:#fff;opacity:0.55\">01<\u002Fspan>\n          <span style=\"font-family:var(--font-display);font-weight:300;font-size:36px;line-height:1.12;color:#fff\"><span class=\"rv\">Anchor to scarce assets<span class=\"rv-card\">Value held in what cannot be printed - the part of the portfolio whose supply is outside policy control.<\u002Fspan><\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div data-rv=\"\" style=\"animation-delay:0.20s;display:grid;grid-template-columns:58px 1fr;gap:22px;align-items:baseline;padding:26px 0;border-bottom:1px solid rgba(255,255,255,0.14)\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:40px;line-height:1;color:#fff;opacity:0.55\">02<\u002Fspan>\n          <span style=\"font-family:var(--font-display);font-weight:300;font-size:36px;line-height:1.12;color:#fff\"><span class=\"rv\">Rise with debasement<span class=\"rv-card\">Structurally on the right side of the trade, not tactically positioned for it.<\u002Fspan><\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div data-rv=\"\" style=\"animation-delay:0.30s;display:grid;grid-template-columns:58px 1fr;gap:22px;align-items:baseline;padding:26px 0\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:40px;line-height:1;color:#fff;opacity:0.55\">03<\u002Fspan>\n          <span style=\"font-family:var(--font-display);font-weight:300;font-size:36px;line-height:1.12;color:#fff\"><span class=\"rv\">Sit outside policy<span class=\"rv-card\">The only allocation whose return does not depend on a central-bank or fiscal decision.<\u002Fspan><\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--beige-100);padding:32px 44px 36px\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:1px solid var(--beige-400);padding-bottom:14px\">\n          <span style=\"font-family:var(--font-label);font-size:15px;letter-spacing:0.2em;text-transform:uppercase;color:var(--grey-800)\">What it is not built to do<\u002Fspan>\n          <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:22px;color:var(--grey-800);opacity:0.7\">the limits<\u002Fspan>\n        <\u002Fdiv>\n        <div data-rv=\"\" style=\"animation-delay:0.15s;display:grid;grid-template-columns:58px 1fr;gap:22px;align-items:baseline;padding:26px 0;border-bottom:1px solid var(--beige-400)\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:40px;line-height:1;color:var(--grey-800)\">04<\u002Fspan>\n          <span style=\"font-family:var(--font-display);font-weight:300;font-size:36px;line-height:1.12;color:var(--grey-800)\"><span class=\"rv\">Not an equity-drawdown hedge<span class=\"rv-card\">It hedges debasement, not panic. In a liquidity event it is sold alongside risk assets.<\u002Fspan><\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div data-rv=\"\" style=\"animation-delay:0.25s;display:grid;grid-template-columns:58px 1fr;gap:22px;align-items:baseline;padding:26px 0;border-bottom:1px solid var(--beige-400)\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:40px;line-height:1;color:var(--grey-800)\">05<\u002Fspan>\n          <span style=\"font-family:var(--font-display);font-weight:300;font-size:36px;line-height:1.12;color:var(--grey-800)\"><span class=\"rv\">Not a source of income<span class=\"rv-card\">No coupon, no dividend. It compounds capital; it does not fund spending.<\u002Fspan><\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div data-rv=\"\" style=\"animation-delay:0.35s;display:grid;grid-template-columns:58px 1fr;gap:22px;align-items:baseline;padding:26px 0\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:40px;line-height:1;color:var(--grey-800)\">06<\u002Fspan>\n          <span style=\"font-family:var(--font-display);font-weight:300;font-size:36px;line-height:1.12;color:var(--grey-800)\"><span class=\"rv\">Not a short-horizon position<span class=\"rv-card\">Position sizing must let you hold it through a 30% drawdown without being forced to sell.<\u002Fspan><\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"09 Three scarce anchors\" data-speaker-notes=\"Three supply mechanisms no committee can revise.\" style=\"width:1920px;height:1080px;overflow:hidden;box-sizing:border-box;background:#fff;color:#000;font-family:Arial,sans-serif\">\n  <img src=\"2a5705b4-f1c6-4242-aebd-98c959fcc200\" alt=\"Cape Capital\" style=\"position:absolute;top:64px;left:64px;width:130px;z-index:10\">\n  <div style=\"position:absolute;top:66px;right:64px;font-family:var(--font-label);font-size:16px;letter-spacing:0.22em;text-transform:uppercase;color:var(--grey-800);z-index:10\">Internal only<\u002Fdiv>\n  <div style=\"position:absolute;bottom:48px;right:64px;font-family:var(--font-label);font-size:20px;letter-spacing:0.22em;color:var(--grey-800);z-index:10\">09<\u002Fdiv>\n  <div data-cite=\"\" style=\"position:absolute;bottom:46px;left:64px;right:220px;font-family:Arial,sans-serif;font-size:16px;line-height:1.4;color:#000;opacity:0.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Sources: World Gold Council, LBMA, USGS, S&amp;P Global, Glassnode, Bloomberg. Volatilities 3y rolling annualised, as at 29 July 2026.<\u002Fdiv>\n\n  <div style=\"padding:224px 64px 160px;height:100%;box-sizing:border-box;display:flex;flex-direction:column\">\n    <div style=\"margin-bottom:64px\">\n      <div style=\"width:56px;height:2px;background:var(--capital-red);margin:0 0 20px\"><\u002Fdiv>\n      <div style=\"font-family:Arial,sans-serif;font-size:18px;letter-spacing:0.22em;text-transform:uppercase;color:var(--capital-red);height:22px;line-height:22px;margin:0 0 22px;white-space:nowrap;overflow:hidden\">The response<\u002Fdiv>\n      <h1 style=\"font-family:var(--font-display);font-weight:300;font-size:56px;letter-spacing:-0.025em;line-height:60px;height:60px;margin:0;white-space:nowrap;color:#000\">Three kinds of scarcity, one shared purpose<\u002Fh1>\n      <p style=\"font-family:Arial,sans-serif;font-size:22px;line-height:32px;height:32px;color:var(--grey-800);margin:16px 0 0;white-space:nowrap\">Supply that <span class=\"rv\">no committee can readily revise<span class=\"rv-card\">Gold is bounded by mining geology, copper by a decade-long capex cycle, bitcoin by a hard-coded issuance schedule. None of the three can be expanded by policy decision.<\u002Fspan><\u002Fspan> - geology, capex cycles, mathematics.<\u002Fp>\n    <\u002Fdiv>\n    <div data-rv=\"\" style=\"display:flex;align-items:center;gap:22px;border-top:3px solid var(--capital-red);background:var(--beige-100);padding:10px 24px;margin-bottom:14px\">\n      <span style=\"font-family:var(--font-label);font-size:13px;letter-spacing:0.2em;text-transform:uppercase;color:var(--capital-red);white-space:nowrap\">Natural supply constraint<\u002Fspan>\n      <span style=\"flex:1;height:1px;background:var(--beige-400)\"><\u002Fspan>\n      <span style=\"font-family:var(--font-display);font-weight:300;font-size:23px;line-height:1.1;color:#000\">Each leg is bounded by physics, geology or code - none by a policy decision<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:96px;align-content:start\">\n      <div>\n        <div data-rv-glow=\"\" style=\"border-top:3px solid var(--capital-red);background:var(--beige-100);padding:20px 26px 22px\">\n          <div style=\"font-family:var(--font-label);font-size:14px;letter-spacing:0.2em;text-transform:uppercase;color:var(--capital-red);height:18px\">Analogue scarcity<\u002Fdiv>\n          <div style=\"font-family:var(--font-display);font-weight:300;font-size:40px;line-height:1;letter-spacing:-0.025em;margin-top:8px\">Gold<\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;gap:10px;margin-top:11px;border-top:1px solid var(--beige-400);padding-top:11px\">\n            <span style=\"font-family:var(--font-display);font-weight:300;font-size:46px;line-height:1;color:var(--capital-red)\">+1.5%<\u002Fspan>\n            <span style=\"font-family:var(--font-label);font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:var(--grey-800)\">supply / year<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);margin-top:8px;height:20px\">Bounded by mining geology<\u002Fdiv>\n          <div style=\"font-family:var(--font-display);font-weight:300;font-size:22px;line-height:1.2;margin-top:13px\"><span class=\"rv\">Monetary memory<span class=\"rv-card\">Five thousand years as a store of value, and a standing central-bank bid. The lowest-volatility leg and the anchor of the basket.<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:0;margin-top:16px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:2px 0;border-bottom:1px solid var(--grey-100)\"><span style=\"font-family:var(--font-label);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--grey-800)\">Trading history<\u002Fspan><span style=\"font-family:var(--font-display);font-weight:300;font-size:24px;color:#000\">5,000y<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:2px 0;border-bottom:1px solid var(--grey-100)\"><span style=\"font-family:var(--font-label);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--grey-800)\">Volatility (ann.)<\u002Fspan><span style=\"font-family:var(--font-display);font-weight:300;font-size:24px;color:#000\">~18%<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:2px 0;border-bottom:1px solid var(--grey-100)\"><span style=\"font-family:var(--font-label);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--grey-800)\">Market size<\u002Fspan><span style=\"font-family:var(--font-display);font-weight:300;font-size:24px;color:#000\">$28tn<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div data-rv-glow=\"\" style=\"border-top:3px solid var(--capital-red);background:var(--beige-100);padding:20px 26px 22px\">\n          <div style=\"font-family:var(--font-label);font-size:14px;letter-spacing:0.2em;text-transform:uppercase;color:var(--capital-red);height:18px\">Electrification scarcity<\u002Fdiv>\n          <div style=\"font-family:var(--font-display);font-weight:300;font-size:40px;line-height:1;letter-spacing:-0.025em;margin-top:8px\">Copper<\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;gap:10px;margin-top:11px;border-top:1px solid var(--beige-400);padding-top:11px\">\n            <span style=\"font-family:var(--font-display);font-weight:300;font-size:46px;line-height:1;color:var(--capital-red)\">~15y<\u002Fspan>\n            <span style=\"font-family:var(--font-label);font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:var(--grey-800)\">new mine to first ore<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);margin-top:8px;height:20px\">Demand structural, supply slow<\u002Fdiv>\n          <div style=\"font-family:var(--font-display);font-weight:300;font-size:22px;line-height:1.2;margin-top:13px\"><span class=\"rv\">The metal of every watt<span class=\"rv-card\">Grids, EVs and data centres are structural demand. There is no substitute at scale, and no new supply inside a decade.<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:0;margin-top:22px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:2px 0;border-bottom:1px solid var(--grey-100)\"><span style=\"font-family:var(--font-label);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--grey-800)\">Trading history<\u002Fspan><span style=\"font-family:var(--font-display);font-weight:300;font-size:24px;color:#000\">~150y<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:2px 0;border-bottom:1px solid var(--grey-100)\"><span style=\"font-family:var(--font-label);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--grey-800)\">Volatility (ann.)<\u002Fspan><span style=\"font-family:var(--font-display);font-weight:300;font-size:24px;color:#000\">~25%<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:2px 0;border-bottom:1px solid var(--grey-100)\"><span style=\"font-family:var(--font-label);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--grey-800)\">Market size<\u002Fspan><span style=\"font-family:var(--font-display);font-weight:300;font-size:24px;color:#000\">$2tn<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div data-rv-glow=\"\" style=\"border-top:3px solid var(--capital-red);background:var(--beige-100);padding:20px 26px 22px\">\n          <div style=\"font-family:var(--font-label);font-size:14px;letter-spacing:0.2em;text-transform:uppercase;color:var(--capital-red);height:18px\">Digital scarcity<\u002Fdiv>\n          <div style=\"font-family:var(--font-display);font-weight:300;font-size:40px;line-height:1;letter-spacing:-0.025em;margin-top:8px\">Bitcoin<\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;gap:10px;margin-top:11px;border-top:1px solid var(--beige-400);padding-top:11px\">\n            <span style=\"font-family:var(--font-display);font-weight:300;font-size:46px;line-height:1;color:var(--capital-red)\">21m<\u002Fspan>\n            <span style=\"font-family:var(--font-label);font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:var(--grey-800)\">hard cap · forever<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);margin-top:8px;height:20px\">Issuance halves every four years<\u002Fdiv>\n          <div style=\"font-family:var(--font-display);font-weight:300;font-size:22px;line-height:1.2;margin-top:13px\"><span class=\"rv\">Enforced by code<span class=\"rv-card\">A fixed supply schedule that no committee can revise - a monetary alternative for a world where the money supply is a political decision.<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:0;margin-top:22px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:2px 0;border-bottom:1px solid var(--grey-100)\"><span style=\"font-family:var(--font-label);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--grey-800)\">Trading history<\u002Fspan><span style=\"font-family:var(--font-display);font-weight:300;font-size:24px;color:#000\">17y<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:2px 0;border-bottom:1px solid var(--grey-100)\"><span style=\"font-family:var(--font-label);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--grey-800)\">Volatility (ann.)<\u002Fspan><span style=\"font-family:var(--font-display);font-weight:300;font-size:24px;color:#000\">~65%<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:2px 0;border-bottom:1px solid var(--grey-100)\"><span style=\"font-family:var(--font-label);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--grey-800)\">Market size<\u002Fspan><span style=\"font-family:var(--font-display);font-weight:300;font-size:24px;color:#000\">$1.3tn<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"10 The basket - three legs\" data-speaker-notes=\"Weights set so no single leg dominates risk.\" style=\"width:1920px;height:1080px;overflow:hidden;box-sizing:border-box;background:#fff;color:#000;font-family:Arial,sans-serif\">\n  <img src=\"2a5705b4-f1c6-4242-aebd-98c959fcc200\" alt=\"Cape Capital\" style=\"position:absolute;top:64px;left:64px;width:130px;z-index:10\">\n  <div style=\"position:absolute;top:66px;right:64px;font-family:var(--font-label);font-size:16px;letter-spacing:0.22em;text-transform:uppercase;color:var(--grey-800);z-index:10\">Internal only<\u002Fdiv>\n  <div style=\"position:absolute;bottom:48px;right:64px;font-family:var(--font-label);font-size:20px;letter-spacing:0.22em;color:var(--grey-800);z-index:10\">10<\u002Fdiv>\n  <div data-cite=\"\" style=\"position:absolute;bottom:46px;left:64px;right:220px;font-family:Arial,sans-serif;font-size:16px;line-height:1.4;color:#000;opacity:0.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Sources: Bloomberg, LBMA, LME, Glassnode. 3y rolling vols of 18% gold, 25% copper, 65% BTC; average pairwise correlation ~0.3.<\u002Fdiv>\n\n  <div style=\"padding:224px 64px 160px;height:100%;box-sizing:border-box;display:flex;flex-direction:column\">\n    <div style=\"margin-bottom:64px\">\n      <div style=\"width:56px;height:2px;background:var(--capital-red);margin:0 0 20px\"><\u002Fdiv>\n      <div style=\"font-family:Arial,sans-serif;font-size:18px;letter-spacing:0.22em;text-transform:uppercase;color:var(--capital-red);height:22px;line-height:22px;margin:0 0 22px;white-space:nowrap;overflow:hidden\">The response<\u002Fdiv>\n      <h1 style=\"font-family:var(--font-display);font-weight:300;font-size:56px;letter-spacing:-0.025em;line-height:60px;height:60px;margin:0;white-space:nowrap;color:#000\">The basket: three legs, sized for volatility<\u002Fh1>\n      <p style=\"font-family:Arial,sans-serif;font-size:22px;line-height:32px;height:32px;color:var(--grey-800);margin:16px 0 0;white-space:nowrap\">Gold anchors, copper carries electrification, bitcoin supplies <span class=\"rv\">asymmetry<span class=\"rv-card\">Bitcoin has the widest return distribution of the three. Held at 20% of capital, a 50% drawdown costs ~10% of the basket - the upside is kept, the ruin risk is not.<\u002Fspan><\u002Fspan>.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.9fr 0.78fr;gap:76px;align-items:start\">\n      <div>\n        <div style=\"display:grid;grid-template-columns:236px 1fr 1fr;gap:0 52px;font-family:var(--font-label);font-size:14px;letter-spacing:0.14em;text-transform:uppercase;color:var(--grey-800);border-bottom:2px solid var(--capital-red);padding-bottom:14px\">\n          <span>Leg<\u002Fspan><span>Capital weight<\u002Fspan><span>Risk contribution<\u002Fspan>\n        <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:236px 1fr 1fr;gap:0 52px;align-items:center;padding:30px 0;border-bottom:1px solid var(--grey-200)\">\n        <div><div style=\"font-family:var(--font-display);font-weight:300;font-size:36px;line-height:1\">Gold<\u002Fdiv><div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);margin-top:6px\">~18% vol · analogue scarcity<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"height:12px;background:var(--grey-100)\"><div data-rv-bar=\"\" style=\"animation-delay:.30s;height:100%;width:60%;background:var(--capital-red)\"><\u002Fdiv><\u002Fdiv><div style=\"font-family:var(--font-label);font-size:21px;letter-spacing:0.1em;margin-top:12px;color:#000\">60%<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"height:12px;background:var(--grey-100)\"><div data-rv-bar=\"\" style=\"animation-delay:0.40s;height:100%;width:37%;background:var(--grey-400)\"><\u002Fdiv><\u002Fdiv><div style=\"font-family:var(--font-label);font-size:21px;letter-spacing:0.1em;margin-top:12px;color:var(--grey-800)\">~37%<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:236px 1fr 1fr;gap:0 52px;align-items:center;padding:30px 0;border-bottom:1px solid var(--grey-200)\">\n        <div><div style=\"font-family:var(--font-display);font-weight:300;font-size:36px;line-height:1\">Copper<\u002Fdiv><div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);margin-top:6px\">~25% vol · electrification scarcity<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"height:12px;background:var(--grey-100)\"><div data-rv-bar=\"\" style=\"animation-delay:.45s;height:100%;width:20%;background:var(--capital-red)\"><\u002Fdiv><\u002Fdiv><div style=\"font-family:var(--font-label);font-size:21px;letter-spacing:0.1em;margin-top:12px;color:#000\">20%<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"height:12px;background:var(--grey-100)\"><div data-rv-bar=\"\" style=\"animation-delay:0.55s;height:100%;width:13%;background:var(--grey-400)\"><\u002Fdiv><\u002Fdiv><div style=\"font-family:var(--font-label);font-size:21px;letter-spacing:0.1em;margin-top:12px;color:var(--grey-800)\">~13%<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:236px 1fr 1fr;gap:0 52px;align-items:center;padding:30px 0;border-bottom:1px solid var(--grey-200)\">\n        <div><div style=\"font-family:var(--font-display);font-weight:300;font-size:36px;line-height:1\">Bitcoin<\u002Fdiv><div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);margin-top:6px\">~65% vol · digital scarcity<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"height:12px;background:var(--grey-100)\"><div data-rv-bar=\"\" style=\"animation-delay:.60s;height:100%;width:20%;background:var(--capital-red)\"><\u002Fdiv><\u002Fdiv><div style=\"font-family:var(--font-label);font-size:21px;letter-spacing:0.1em;margin-top:12px;color:#000\">20%<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"height:12px;background:var(--grey-100)\"><div data-rv-bar=\"\" style=\"animation-delay:0.70s;height:100%;width:50%;background:var(--capital-red)\"><\u002Fdiv><\u002Fdiv><div style=\"font-family:var(--font-label);font-size:21px;letter-spacing:0.1em;margin-top:12px;color:var(--capital-red)\">~50%<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-rv-glow=\"\" style=\"border-top:3px solid var(--capital-red);padding:24px 26px;background:var(--beige-100)\">\n        <div style=\"font-family:var(--font-label);font-size:13px;letter-spacing:0.2em;text-transform:uppercase;color:var(--capital-red)\">Risk decomposition<\u002Fdiv>\n        <div style=\"font-family:var(--font-display);font-weight:300;font-size:34px;line-height:1.1;letter-spacing:-0.02em;margin-top:12px\">Historical basket vol <em style=\"font-style:italic\">~22%<\u002Fem><\u002Fdiv>\n        <div style=\"display:grid;gap:13px;margin-top:26px\">\n          <div style=\"display:flex;align-items:center;gap:12px\"><span style=\"font-family:var(--font-label);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;min-width:86px;color:var(--grey-800)\">Analogue<\u002Fspan><span style=\"flex:1;height:9px;background:#fff\"><span data-rv-bar=\"\" style=\"animation-delay:.8s;display:block;height:100%;width:37%;background:var(--grey-400)\"><\u002Fspan><\u002Fspan><span style=\"font-family:var(--font-label);font-size:14px\">37%<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px\"><span style=\"font-family:var(--font-label);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;min-width:86px;color:var(--grey-800)\">Industrial<\u002Fspan><span style=\"flex:1;height:9px;background:#fff\"><span data-rv-bar=\"\" style=\"animation-delay:.9s;display:block;height:100%;width:13%;background:var(--red-300)\"><\u002Fspan><\u002Fspan><span style=\"font-family:var(--font-label);font-size:14px\">13%<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px\"><span style=\"font-family:var(--font-label);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;min-width:86px;color:var(--capital-red)\">Digital<\u002Fspan><span style=\"flex:1;height:9px;background:#fff\"><span data-rv-bar=\"\" style=\"animation-delay:1s;display:block;height:100%;width:50%;background:var(--capital-red)\"><\u002Fspan><\u002Fspan><span style=\"font-family:var(--font-label);font-size:14px;color:var(--capital-red)\">50%<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-family:Arial,sans-serif;font-size:16px;line-height:1.55;color:var(--grey-800);margin:24px 0 0\">Half the historical risk sits in the smallest capital weight. <span class=\"rv\">Rebalance, don't ride<span class=\"rv-card\">An annual reset to 60/20/20 sells the winner and funds the laggard. Over a full cycle the rebalance premium is the most reliable part of the return.<\u002Fspan><\u002Fspan>.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"11 The third pillar\" data-speaker-notes=\"Not a recession hedge. The inflation regime sets the outcome.\" style=\"width:1920px;height:1080px;overflow:hidden;box-sizing:border-box;background:#fff;color:#000;font-family:Arial,sans-serif\">\n  <img src=\"2a5705b4-f1c6-4242-aebd-98c959fcc200\" alt=\"Cape Capital\" style=\"position:absolute;top:64px;left:64px;width:130px;z-index:10\">\n  <div style=\"position:absolute;top:66px;right:64px;font-family:var(--font-label);font-size:16px;letter-spacing:0.22em;text-transform:uppercase;color:var(--grey-800);z-index:10\">Internal only<\u002Fdiv>\n  <div style=\"position:absolute;bottom:48px;right:64px;font-family:var(--font-label);font-size:20px;letter-spacing:0.22em;color:var(--grey-800);z-index:10\">11<\u002Fdiv>\n  <div data-cite=\"\" style=\"position:absolute;bottom:46px;left:64px;right:220px;font-family:Arial,sans-serif;font-size:16px;line-height:1.4;color:#000;opacity:0.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Sources: LBMA, BLS CPI-U, NBER recession dating. Real returns peak-to-trough, indicative.<\u002Fdiv>\n\n  <div style=\"padding:224px 64px 160px;height:100%;box-sizing:border-box;display:flex;flex-direction:column\">\n    <div style=\"margin-bottom:64px\">\n      <div style=\"width:56px;height:2px;background:var(--capital-red);margin:0 0 20px\"><\u002Fdiv>\n      <div style=\"font-family:Arial,sans-serif;font-size:18px;letter-spacing:0.22em;text-transform:uppercase;color:var(--capital-red);height:22px;line-height:22px;margin:0 0 22px;white-space:nowrap;overflow:hidden\">The response<\u002Fdiv>\n      <h1 style=\"font-family:var(--font-display);font-weight:300;font-size:56px;letter-spacing:-0.025em;line-height:60px;height:60px;margin:0;white-space:nowrap;color:#000\">A third pillar beside equity and bonds<\u002Fh1>\n      <p style=\"font-family:Arial,sans-serif;font-size:22px;line-height:32px;height:32px;color:var(--grey-800);margin:16px 0 0;white-space:nowrap\">An additional asset class to compound real wealth - not a <span class=\"rv\">tactical hedge<span class=\"rv-card\">Not designed to offset equity drawdowns over weeks. Designed to capture monetary dilution over years - a different exposure with a different holding period.<\u002Fspan><\u002Fspan> against recessions.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:0.86fr 1.14fr;gap:80px;align-items:start\">\n      <div style=\"display:grid;gap:40px\">\n        <div style=\"display:grid;grid-template-columns:92px 1fr;gap:24px;align-items:start\">\n          <div style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:74px;line-height:0.82;color:var(--capital-red)\">1<\u002Fdiv>\n          <div style=\"font-family:var(--font-display);font-weight:300;font-size:39px;line-height:1.1;letter-spacing:-0.015em;padding-top:4px\"><span class=\"rv\">The third pillar<span class=\"rv-card\">Equity compounds earnings and fixed income contracts a nominal yield - neither is built to hold real value when the unit of account itself is being diluted. Scarcity is the one of the three that preserves real value.<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:92px 1fr;gap:24px;align-items:start\">\n          <div style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:74px;line-height:0.82;color:var(--capital-red)\">2<\u002Fdiv>\n          <div style=\"font-family:var(--font-display);font-weight:300;font-size:39px;line-height:1.1;letter-spacing:-0.015em;padding-top:4px\"><span class=\"rv\">Compounding, not insurance<span class=\"rv-card\">It rises with debasement over years, not against equities over weeks. The holding period is the mechanism, which is why sizing must let you sit with it.<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:92px 1fr;gap:24px;align-items:start\">\n          <div style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:74px;line-height:0.82;color:var(--capital-red)\">3<\u002Fdiv>\n          <div style=\"font-family:var(--font-display);font-weight:300;font-size:39px;line-height:1.1;letter-spacing:-0.015em;padding-top:4px\"><span class=\"rv\">The regime is the variable<span class=\"rv-card\">Gold is an inflation exposure. Disinflationary recessions punish it; inflation regimes reward it. The recession itself is not the signal.<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:var(--font-label);font-size:17px;letter-spacing:0.18em;text-transform:uppercase;color:var(--capital-red);margin-bottom:18px\">Gold real return · US recessions<\u002Fdiv>\n<svg sc-camel-view-box=\"0 0 848 344\" style=\"width:100%;max-height:396px;height:auto;display:block\" role=\"img\" aria-label=\"Gold real return in US recessions by inflation regime\">\n          <g stroke=\"var(--grey-100)\" stroke-width=\"1\"><line x1=\"96\" y1=\"18\" x2=\"824\" y2=\"18\"><\u002Fline><line x1=\"96\" y1=\"84\" x2=\"824\" y2=\"84\"><\u002Fline><line x1=\"96\" y1=\"216\" x2=\"824\" y2=\"216\"><\u002Fline><\u002Fg>\n          <line x1=\"96\" y1=\"150\" x2=\"824\" y2=\"150\" stroke=\"var(--grey-800)\" stroke-width=\"1.4\"><\u002Fline>\n          <g font-family=\"Arial, sans-serif\" font-size=\"15\" fill=\"var(--grey-800)\" text-anchor=\"end\"><text x=\"86\" y=\"23\">+40%<\u002Ftext><text x=\"86\" y=\"89\">+20%<\u002Ftext><text x=\"86\" y=\"155\">0<\u002Ftext><text x=\"86\" y=\"221\">-20%<\u002Ftext><\u002Fg>\n          <rect data-rv-col=\"\" style=\"animation-delay:0.40s\" x=\"125.3\" y=\"54.3\" width=\"87\" height=\"95.7\" fill=\"var(--capital-red)\"><\u002Frect>\n          <t
