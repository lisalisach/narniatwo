tive<\u002Fdiv>\n          <div style=\"font-family:var(--font-display);font-weight:300;font-size:20px;line-height:1.15;margin-top:5px;color:var(--grey-800)\">ZKB Gold ETF<\u002Fdiv>\n          <div style=\"font-family:var(--font-label);font-size:11px;letter-spacing:0.14em;color:var(--grey-400);margin-top:4px\">ZGLD SW<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:14px;line-height:1.45;color:var(--grey-400);margin-top:7px\">Physical, TER ~0.40%, CHF/USD/EUR classes. Swiss vaults, deep SIX liquidity, no lending.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:3px solid var(--capital-red);padding-top:22px\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-size:40px;line-height:1\">Copper<\u002Fspan>\n          <span style=\"font-family:var(--font-label);font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:var(--capital-red)\">20% · electrification<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);margin-top:6px\">~30% vol · the real economy<\u002Fdiv>\n        <div data-rv-glow=\"\" style=\"background:var(--beige-100);border-top:3px solid var(--capital-red);padding:22px 24px 24px;margin-top:20px\">\n          <div style=\"font-family:var(--font-label);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--capital-red)\">Primary<\u002Fdiv>\n          <div style=\"font-family:var(--font-display);font-weight:300;font-size:34px;line-height:1.12;margin-top:10px\">Ixios Copper<\u002Fdiv>\n          <div style=\"font-family:var(--font-label);font-size:13px;letter-spacing:0.14em;color:var(--capital-red);margin-top:6px\">Active SICAV · miners<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:17px;line-height:1.5;color:var(--grey-800);margin-top:12px\"><span class=\"rv\">Played through the miners<span class=\"rv-card\">Active, concentrated copper-mining equity. Miners give operating leverage to the copper price and pay a dividend, which no metal wrapper does - the trade-off is equity-market beta.<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid var(--grey-200);padding:12px 0 0;margin-top:16px\">\n          <div style=\"font-family:var(--font-label);font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--grey-400)\">Alternative<\u002Fdiv>\n          <div style=\"font-family:var(--font-display);font-weight:300;font-size:20px;line-height:1.15;margin-top:5px;color:var(--grey-800)\">Global X Copper Miners<\u002Fdiv>\n          <div style=\"font-family:var(--font-label);font-size:11px;letter-spacing:0.14em;color:var(--grey-400);margin-top:4px\">COPX US<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:14px;line-height:1.45;color:var(--grey-400);margin-top:7px\">Passive miners, TER 0.65%, USD ~7bn. UCITS version at 0.55%.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:3px solid var(--capital-red);padding-top:22px\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-size:40px;line-height:1\">Bitcoin<\u002Fspan>\n          <span style=\"font-family:var(--font-label);font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:var(--capital-red)\">20% · digital<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);margin-top:6px\">~65% vol · the asymmetry<\u002Fdiv>\n        <div data-rv-glow=\"\" style=\"background:var(--beige-100);border-top:3px solid var(--capital-red);padding:22px 24px 24px;margin-top:20px\">\n          <div style=\"font-family:var(--font-label);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--capital-red)\">Primary<\u002Fdiv>\n          <div style=\"font-family:var(--font-display);font-weight:300;font-size:34px;line-height:1.12;margin-top:10px\">iShares Bitcoin Trust<\u002Fdiv>\n          <div style=\"font-family:var(--font-label);font-size:13px;letter-spacing:0.14em;color:var(--capital-red);margin-top:6px\">IBIT US<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:17px;line-height:1.5;color:var(--grey-800);margin-top:12px\"><span class=\"rv\">The deepest venue<span class=\"rv-card\">Spot BTC, TER 0.25%, USD ~65bn. BlackRock with Coinbase custody - the tightest spreads of any spot vehicle.<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid var(--grey-200);padding:12px 0 0;margin-top:16px\">\n          <div style=\"font-family:var(--font-label);font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--grey-400)\">Alternative<\u002Fdiv>\n          <div style=\"font-family:var(--font-display);font-weight:300;font-size:20px;line-height:1.15;margin-top:5px;color:var(--grey-800)\">Fidelity Wise Origin<\u002Fdiv>\n          <div style=\"font-family:var(--font-label);font-size:11px;letter-spacing:0.14em;color:var(--grey-400);margin-top:4px\">FBTC US<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:14px;line-height:1.45;color:var(--grey-400);margin-top:7px\">Spot BTC, TER 0.25%, Fidelity self-custody. Diversifies counterparty risk.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"21 Six observations\" data-speaker-notes=\"Not a recommendation. What the argument implies.\" style=\"width:1920px;height:1080px;overflow:hidden;box-sizing:border-box;background:#fff;color:#000;font-family:Arial,sans-serif\">\n  <img src=\"2a5705b4-f1c6-4242-aebd-98c959fcc200\" alt=\"Cape Capital\" style=\"position:absolute;top:64px;left:64px;width:130px;z-index:10\">\n  <div style=\"position:absolute;top:66px;right:64px;font-family:var(--font-label);font-size:16px;letter-spacing:0.22em;text-transform:uppercase;color:var(--grey-800);z-index:10\">Internal only<\u002Fdiv>\n  <div style=\"position:absolute;bottom:48px;right:64px;font-family:var(--font-label);font-size:20px;letter-spacing:0.22em;color:var(--grey-800);z-index:10\">21<\u002Fdiv>\n  <div data-cite=\"\" style=\"position:absolute;bottom:46px;left:64px;right:220px;font-family:Arial,sans-serif;font-size:16px;line-height:1.4;color:#000;opacity:0.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Sources: IMF Fiscal Monitor, BIS, LBMA, Bloomberg, July 2026.<\u002Fdiv>\n\n  <div style=\"padding:224px 64px 160px;height:100%;box-sizing:border-box;display:flex;flex-direction:column\">\n    <div style=\"margin-bottom:64px\">\n      <div style=\"width:56px;height:2px;background:var(--capital-red);margin:0 0 20px\"><\u002Fdiv>\n      <div style=\"font-family:Arial,sans-serif;font-size:18px;letter-spacing:0.22em;text-transform:uppercase;color:var(--capital-red);height:22px;line-height:22px;margin:0 0 22px;white-space:nowrap;overflow:hidden\">In summary<\u002Fdiv>\n      <h1 style=\"font-family:var(--font-display);font-weight:300;font-size:56px;letter-spacing:-0.025em;line-height:60px;height:60px;margin:0;white-space:nowrap;color:#000\">Six points to take away<\u002Fh1>\n      <p style=\"font-family:Arial,sans-serif;font-size:22px;line-height:32px;height:32px;color:var(--grey-800);margin:16px 0 0;white-space:nowrap\">Weigh each against your own <span class=\"rv\">time horizon and liquidity needs<span class=\"rv-card\">Whether and how to act depends on your time horizon, your liquidity needs and your mandate constraints - not on the data in this deck.<\u002Fspan><\u002Fspan> before deciding anything.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:0 0;align-content:start;border-top:2px solid var(--capital-red)\">\n      <div data-rv=\"\" style=\"animation-delay:0.08s;padding:22px 30px 24px;border-right:1px solid var(--grey-200);border-bottom:1px solid var(--grey-200);background:var(--beige-100);\">\n        <div style=\"display:flex;align-items:baseline;gap:16px\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:44px;line-height:0.85;color:var(--capital-red)\">1<\u002Fspan>\n          <span style=\"flex:1;height:1px;background:var(--grey-200)\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-family:var(--font-display);font-weight:300;font-size:29px;line-height:1.14;margin-top:15px;color:#000\"><span class=\"rv\">Debasement is decided, not forecast<span class=\"rv-card\">One politically viable lever remains at ~125% debt-to-GDP, and it has been pulled. Own what the currency is debased against.<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div data-rv=\"\" style=\"animation-delay:0.16s;padding:22px 30px 24px;border-right:1px solid var(--grey-200);border-bottom:1px solid var(--grey-200);\">\n        <div style=\"display:flex;align-items:baseline;gap:16px\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:44px;line-height:0.85;color:var(--capital-red)\">2<\u002Fspan>\n          <span style=\"flex:1;height:1px;background:var(--grey-200)\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-family:var(--font-display);font-weight:300;font-size:29px;line-height:1.14;margin-top:15px;color:#000\"><span class=\"rv\">The three legs share a purpose, not a volatility<span class=\"rv-card\">Scarce, non-sovereign, outside any single balance sheet. 60/20/20 sizes for volatility, not for view.<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div data-rv=\"\" style=\"animation-delay:0.24s;padding:22px 30px 24px;border-bottom:1px solid var(--grey-200);\">\n        <div style=\"display:flex;align-items:baseline;gap:16px\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:44px;line-height:0.85;color:var(--capital-red)\">3<\u002Fspan>\n          <span style=\"flex:1;height:1px;background:var(--grey-200)\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-family:var(--font-display);font-weight:300;font-size:29px;line-height:1.14;margin-top:15px;color:#000\"><span class=\"rv\">Inflation and debasement are not the same<span class=\"rv-card\">CPI is one yardstick, gold another, M2 a third. Measured only against CPI, a portfolio understates the loss.<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div data-rv=\"\" style=\"animation-delay:0.32s;padding:22px 30px 24px;border-right:1px solid var(--grey-200);\">\n        <div style=\"display:flex;align-items:baseline;gap:16px\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:44px;line-height:0.85;color:var(--capital-red)\">4<\u002Fspan>\n          <span style=\"flex:1;height:1px;background:var(--grey-200)\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-family:var(--font-display);font-weight:300;font-size:29px;line-height:1.14;margin-top:15px;color:#000\"><span class=\"rv\">It complements fixed income, not replaces it<span class=\"rv-card\">Bonds still hedge the deflation and liquidity corner the basket cannot carry. Combined coverage beats either alone.<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div data-rv=\"\" style=\"animation-delay:0.40s;padding:22px 30px 24px;border-right:1px solid var(--grey-200);\">\n        <div style=\"display:flex;align-items:baseline;gap:16px\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:44px;line-height:0.85;color:var(--capital-red)\">5<\u002Fspan>\n          <span style=\"flex:1;height:1px;background:var(--grey-200)\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-family:var(--font-display);font-weight:300;font-size:29px;line-height:1.14;margin-top:15px;color:#000\"><span class=\"rv\">The size scales with par exposure<span class=\"rv-card\">~5% inside Balanced 70/30; the same principle scales to ~20% for a standalone fixed-income mandate.<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div data-rv=\"\" style=\"animation-delay:0.48s;padding:22px 30px 24px;\">\n        <div style=\"display:flex;align-items:baseline;gap:16px\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:44px;line-height:0.85;color:var(--capital-red)\">6<\u002Fspan>\n          <span style=\"flex:1;height:1px;background:var(--grey-200)\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-family:var(--font-display);font-weight:300;font-size:29px;line-height:1.14;margin-top:15px;color:#000\"><span class=\"rv\">Run through the macro process<span class=\"rv-card\">Bought, sold and sized by the team that already runs duration and credit - one investment philosophy, different instruments.<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"22 Divider - appendix\" data-speaker-notes=\"Reference material: the target instrument for each leg.\" style=\"width:1920px;height:1080px;overflow:hidden;box-sizing:border-box;background:var(--deep-red);color:#fff;font-family:Arial,sans-serif\">\n  <img src=\"e0ad9ade-68b1-416e-9811-ccebd51935fb\" alt=\"Cape Capital\" style=\"position:absolute;top:64px;left:64px;width:130px;z-index:10\">\n  <div style=\"position:absolute;top:66px;right:64px;font-family:var(--font-label);font-size:16px;letter-spacing:0.22em;text-transform:uppercase;color:#fff;z-index:10\">Internal only<\u002Fdiv>\n  <div style=\"position:absolute;bottom:48px;right:64px;font-family:var(--font-label);font-size:20px;letter-spacing:0.22em;color:#fff;z-index:10\">22<\u002Fdiv>\n\n  <div style=\"padding:224px 64px 200px;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center\">\n    <div style=\"width:56px;height:2px;background:#fff;margin:0 0 20px\"><\u002Fdiv>\n    <div style=\"font-family:Arial,sans-serif;font-size:18px;letter-spacing:0.22em;text-transform:uppercase;color:#fff;margin-bottom:30px\">Reference<\u002Fdiv>\n    <h1 style=\"font-family:var(--font-display);font-weight:300;font-size:100px;letter-spacing:-0.03em;line-height:1.0;margin:0;color:#fff;white-space:nowrap\">Appendix — <em style=\"font-style:italic\">the instruments<\u002Fem><\u002Fh1>\n    <p style=\"font-family:Arial,sans-serif;font-size:26px;line-height:36px;color:#fff;margin:40px 0 0;white-space:nowrap\">The target instrument for each leg, its specification, and the fallback.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"23 Appendix - gold\" data-speaker-notes=\"Physical, allocated, responsibly sourced. ZKB is the operational fallback.\" style=\"width:1920px;height:1080px;overflow:hidden;box-sizing:border-box;background:#fff;color:#000;font-family:Arial,sans-serif\">\n  <img src=\"2a5705b4-f1c6-4242-aebd-98c959fcc200\" alt=\"Cape Capital\" style=\"position:absolute;top:64px;left:64px;width:130px;z-index:10\">\n  <div style=\"position:absolute;top:66px;right:64px;font-family:var(--font-label);font-size:16px;letter-spacing:0.22em;text-transform:uppercase;color:var(--grey-800);z-index:10\">Internal only<\u002Fdiv>\n  <div style=\"position:absolute;bottom:48px;right:64px;font-family:var(--font-label);font-size:20px;letter-spacing:0.22em;color:var(--grey-800);z-index:10\">23<\u002Fdiv>\n  <div data-cite=\"\" style=\"position:absolute;bottom:46px;left:64px;right:220px;font-family:Arial,sans-serif;font-size:16px;line-height:1.4;color:#000;opacity:0.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Sources: issuer factsheets and KIDs, June/July 2026. AUM and TER subject to change; due diligence in progress.<\u002Fdiv>\n\n  <div style=\"padding:224px 64px 160px;height:100%;box-sizing:border-box;display:flex;flex-direction:column\">\n    <div style=\"margin-bottom:64px\">\n      <div style=\"width:56px;height:2px;background:var(--capital-red);margin:0 0 20px\"><\u002Fdiv>\n      <div style=\"font-family:Arial,sans-serif;font-size:18px;letter-spacing:0.22em;text-transform:uppercase;color:var(--capital-red);height:22px;line-height:22px;margin:0 0 22px;white-space:nowrap;overflow:hidden\">Appendix<\u002Fdiv>\n      <h1 style=\"font-family:var(--font-display);font-weight:300;font-size:56px;letter-spacing:-0.025em;line-height:60px;height:60px;margin:0;white-space:nowrap;color:#000\">Gold - the target instrument<\u002Fh1>\n      <p style=\"font-family:Arial,sans-serif;font-size:22px;line-height:32px;height:32px;color:var(--grey-800);margin:16px 0 0;white-space:nowrap\">Physical and allocated, with a responsible-sourcing standard on top.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:660px 1fr;gap:72px;align-items:start\">\n      <div>\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:16px\">\n          <span style=\"font-family:var(--font-label);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;background:var(--capital-red);color:#fff;padding:5px 11px\">Leg 1 / 3<\u002Fspan><span style=\"font-family:var(--font-label);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;border:1px solid var(--grey-300);color:var(--grey-800);padding:5px 11px\">Gold<\u002Fspan><span style=\"font-family:var(--font-label);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;border:1px solid var(--grey-300);color:var(--grey-800);padding:5px 11px\">60%<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:14px;border-top:3px solid var(--capital-red);padding-top:16px\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-size:34px;line-height:1.1\">Swiss Positive Gold<\u002Fspan>\n          <span style=\"font-family:var(--font-label);font-size:13px;letter-spacing:0.16em;color:var(--capital-red)\">SPGOLD<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:230px 1fr;gap:0 28px;margin-top:16px\">\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);padding:2px 0;border-bottom:1px solid var(--grey-100)\">Wrapper<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:#000;padding:2px 0;border-bottom:1px solid var(--grey-100)\">UCITS ETC · planned<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);padding:2px 0;border-bottom:1px solid var(--grey-100)\">Domicile / listing<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:#000;padding:2px 0;border-bottom:1px solid var(--grey-100)\">Switzerland · SIX (planned)<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);padding:2px 0;border-bottom:1px solid var(--grey-100)\">Replication<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:#000;padding:2px 0;border-bottom:1px solid var(--grey-100)\">100% physical, allocated<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);padding:2px 0;border-bottom:1px solid var(--grey-100)\">Custody<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:#000;padding:2px 0;border-bottom:1px solid var(--grey-100)\">Swiss vaults · no lending<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);padding:2px 0;border-bottom:1px solid var(--grey-100)\">Gold source<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:#000;padding:2px 0;border-bottom:1px solid var(--grey-100)\">Swiss Positive Gold+ · ESG-screened bars<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);padding:2px 0;border-bottom:1px solid var(--grey-100)\">TER<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-400);padding:2px 0;border-bottom:1px solid var(--grey-100)\">To be confirmed<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);padding:2px 0;border-bottom:1px solid var(--grey-100)\">AUM<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-400);padding:2px 0;border-bottom:1px solid var(--grey-100)\">To be confirmed · newer launch<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);padding:2px 0;border-bottom:1px solid var(--grey-100)\">Currency classes<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-400);padding:2px 0;border-bottom:1px solid var(--grey-100)\">To be confirmed<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);padding:2px 0;border-bottom:1px solid var(--grey-100)\">Physical redemption<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-400);padding:2px 0;border-bottom:1px solid var(--grey-100)\">To be confirmed<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);padding:2px 0;border-bottom:1px solid var(--grey-100)\">Premium / discount<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-400);padding:2px 0;border-bottom:1px solid var(--grey-100)\">To be confirmed<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:var(--font-label);font-size:13px;letter-spacing:0.18em;text-transform:uppercase;color:var(--capital-red);border-bottom:2px solid var(--capital-red);padding-bottom:12px\">Why this instrument · key words, open Details for the argument<\u002Fdiv>\n        <div data-rv=\"\" style=\"animation-delay:0.10s;display:grid;grid-template-columns:46px 1fr;gap:16px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--grey-100)\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:30px;line-height:1;color:var(--capital-red)\">01<\u002Fspan>\n          <span><span style=\"display:block;font-family:var(--font-display);font-weight:300;font-size:23px;line-height:1.15;color:#000\">Allocated, not synthetic<\u002Fspan><span style=\"display:block;font-family:Arial,sans-serif;font-size:16px;line-height:1.4;color:var(--grey-800);margin-top:5px\"><span class=\"rv\">Title to specific bars<span class=\"rv-card\">Physical and allocated means the holder has title to identified bars, not a claim on an issuer’s balance sheet. That is the whole point of the leg.<\u002Fspan><\u002Fspan><\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div data-rv=\"\" style=\"animation-delay:0.19s;display:grid;grid-template-columns:46px 1fr;gap:16px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--grey-100)\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:30px;line-height:1;color:var(--capital-red)\">02<\u002Fspan>\n          <span><span style=\"display:block;font-family:var(--font-display);font-weight:300;font-size:23px;line-height:1.15;color:#000\">Sourcing standard<\u002Fspan><span style=\"display:block;font-family:Arial,sans-serif;font-size:16px;line-height:1.4;color:var(--grey-800);margin-top:5px\"><span class=\"rv\">ESG-screened bars only<span class=\"rv-card\">The Swiss Positive Gold+ standard screens refiners and mine origin. It is the differentiator against a conventional physical ETF.<\u002Fspan><\u002Fspan><\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div data-rv=\"\" style=\"animation-delay:0.28s;display:grid;grid-template-columns:46px 1fr;gap:16px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--grey-100)\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:30px;line-height:1;color:var(--capital-red)\">03<\u002Fspan>\n          <span><span style=\"display:block;font-family:var(--font-display);font-weight:300;font-size:23px;line-height:1.15;color:#000\">No securities lending<\u002Fspan><span style=\"display:block;font-family:Arial,sans-serif;font-size:16px;line-height:1.4;color:var(--grey-800);margin-top:5px\"><span class=\"rv\">The bars stay in the vault<span class=\"rv-card\">Lending the metal reintroduces exactly the counterparty risk the leg exists to avoid.<\u002Fspan><\u002Fspan><\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:var(--beige-100);padding:12px 20px 14px;margin-top:10px\">\n          <div style=\"font-family:var(--font-label);font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--capital-red)\">Its role in the basket<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:11px\">\n            <div><div style=\"font-family:var(--font-label);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--grey-800)\">Income<\u002Fdiv><div style=\"font-family:var(--font-display);font-weight:300;font-size:22px;line-height:1.1;margin-top:5px;color:#000\">None<\u002Fdiv><div style=\"font-family:Arial,sans-serif;font-size:14px;line-height:1.4;color:var(--grey-800);margin-top:6px\">No coupon, no dividend - it compounds capital only<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-family:var(--font-label);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--grey-800)\">Volatility<\u002Fdiv><div style=\"font-family:var(--font-display);font-weight:300;font-size:22px;line-height:1.1;margin-top:5px;color:#000\">Lowest of the three<\u002Fdiv><div style=\"font-family:Arial,sans-serif;font-size:14px;line-height:1.4;color:var(--grey-800);margin-top:6px\">~18% annualised; the anchor of the basket<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-family:var(--font-label);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--grey-800)\">Liquidity<\u002Fdiv><div style=\"font-family:var(--font-display);font-weight:300;font-size:22px;line-height:1.1;margin-top:5px;color:#000\">Deep<\u002Fdiv><div style=\"font-family:Arial,sans-serif;font-size:14px;line-height:1.4;color:var(--grey-800);margin-top:6px\">Daily on SIX, plus the global OTC bullion market<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:20px;margin-top:12px;border-top:1px solid var(--grey-200);padding-top:11px\">\n          <span style=\"font-family:var(--font-label);font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--capital-red);white-space:nowrap\">Fallback<\u002Fspan>\n          <span style=\"font-family:Arial,sans-serif;font-size:17px;line-height:1.45;color:var(--grey-800)\"><span class=\"rv\">ZKB Gold ETF if the spec does not clear<span class=\"rv-card\">ZGLD SW is the operationally proven vehicle: TER 0.40%, CHF ~13.6bn, Swiss vaults, no lending, tracking within ±0.1-0.3%. It opens the leg immediately if SPGOLD’s operational detail is not confirmed in time.<\u002Fspan><\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"24 Appendix - copper\" data-speaker-notes=\"Copper through active mining equity. A metal ETC is the fallback.\" style=\"width:1920px;height:1080px;overflow:hidden;box-sizing:border-box;background:#fff;color:#000;font-family:Arial,sans-serif\">\n  <img src=\"2a5705b4-f1c6-4242-aebd-98c959fcc200\" alt=\"Cape Capital\" style=\"position:absolute;top:64px;left:64px;width:130px;z-index:10\">\n  <div style=\"position:absolute;top:66px;right:64px;font-family:var(--font-label);font-size:16px;letter-spacing:0.22em;text-transform:uppercase;color:var(--grey-800);z-index:10\">Internal only<\u002Fdiv>\n  <div style=\"position:absolute;bottom:48px;right:64px;font-family:var(--font-label);font-size:20px;letter-spacing:0.22em;color:var(--grey-800);z-index:10\">24<\u002Fdiv>\n  <div data-cite=\"\" style=\"position:absolute;bottom:46px;left:64px;right:220px;font-family:Arial,sans-serif;font-size:16px;line-height:1.4;color:#000;opacity:0.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Sources: issuer factsheets and KIDs, June/July 2026. AUM and TER subject to change; due diligence in progress.<\u002Fdiv>\n\n  <div style=\"padding:224px 64px 160px;height:100%;box-sizing:border-box;display:flex;flex-direction:column\">\n    <div style=\"margin-bottom:64px\">\n      <div style=\"width:56px;height:2px;background:var(--capital-red);margin:0 0 20px\"><\u002Fdiv>\n      <div style=\"font-family:Arial,sans-serif;font-size:18px;letter-spacing:0.22em;text-transform:uppercase;color:var(--capital-red);height:22px;line-height:22px;margin:0 0 22px;white-space:nowrap;overflow:hidden\">Appendix<\u002Fdiv>\n      <h1 style=\"font-family:var(--font-display);font-weight:300;font-size:56px;letter-spacing:-0.025em;line-height:60px;height:60px;margin:0;white-space:nowrap;color:#000\">Copper - the target instrument<\u002Fh1>\n      <p style=\"font-family:Arial,sans-serif;font-size:22px;line-height:32px;height:32px;color:var(--grey-800);margin:16px 0 0;white-space:nowrap\">Copper is played through active mining equity: operating leverage to the price, plus a dividend.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:660px 1fr;gap:72px;align-items:start\">\n      <div>\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:16px\">\n          <span style=\"font-family:var(--font-label);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;background:var(--capital-red);color:#fff;padding:5px 11px\">Leg 2 / 3<\u002Fspan><span style=\"font-family:var(--font-label);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;border:1px solid var(--grey-300);color:var(--grey-800);padding:5px 11px\">Copper<\u002Fspan><span style=\"font-family:var(--font-label);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;border:1px solid var(--grey-300);color:var(--grey-800);padding:5px 11px\">20%<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:14px;border-top:3px solid var(--capital-red);padding-top:16px\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-size:34px;line-height:1.1\">Ixios Copper<\u002Fspan>\n          <span style=\"font-family:var(--font-label);font-size:13px;letter-spacing:0.16em;color:var(--capital-red)\">Active SICAV<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:230px 1fr;gap:0 28px;margin-top:16px\">\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);padding:2px 0;border-bottom:1px solid var(--grey-100)\">Wrapper<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:#000;padding:2px 0;border-bottom:1px solid var(--grey-100)\">Luxembourg SICAV · active AIF<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);padding:2px 0;border-bottom:1px solid var(--grey-100)\">Domicile / listing<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:#000;padding:2px 0;border-bottom:1px solid var(--grey-100)\">Luxembourg · qualified investors<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);padding:2px 0;border-bottom:1px solid var(--grey-100)\">Exposure<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:#000;padding:2px 0;border-bottom:1px solid var(--grey-100)\">Concentrated copper-mining equity<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);padding:2px 0;border-bottom:1px solid var(--grey-100)\">Holdings<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:#000;padding:2px 0;border-bottom:1px solid var(--grey-100)\">~25-35 names · high conviction<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);padding:2px 0;border-bottom:1px solid var(--grey-100)\">Management<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:#000;padding:2px 0;border-bottom:1px solid var(--grey-100)\">Active · specialist mining team<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);padding:2px 0;border-bottom:1px solid var(--grey-100)\">TER<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:#000;padding:2px 0;border-bottom:1px solid var(--grey-100)\">~1.50% · active fee<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);padding:2px 0;border-bottom:1px solid var(--grey-100)\">AUM<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:#000;padding:2px 0;border-bottom:1px solid var(--grey-100)\">USD ~0.5bn<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);padding:2px 0;border-bottom:1px solid var(--grey-100)\">3y return (ann.)<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:#000;padding:2px 0;border-bottom:1px solid var(--grey-100)\">~+12% p.a.<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);padding:2px 0;border-bottom:1px solid var(--grey-100)\">Liquidity / dealing<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:#000;padding:2px 0;border-bottom:1px solid var(--grey-100)\">Daily NAV · fund dealing<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:var(--grey-800);padding:2px 0;border-bottom:1px solid var(--grey-100)\">Dividend yield<\u002Fdiv>\n          <div style=\"font-family:Arial,sans-serif;font-size:15px;color:#000;padding:2px 0;border-bottom:1px solid var(--grey-100)\">~1.5% · distributed<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:var(--font-label);font-size:13px;letter-spacing:0.18em;text-transform:uppercase;color:var(--capital-red);border-bottom:2px solid var(--capital-red);padding-bottom:12px\">Why this instrument · key words, open Details for the argument<\u002Fdiv>\n        <div data-rv=\"\" style=\"animation-delay:0.10s;display:grid;grid-template-columns:46px 1fr;gap:16px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--grey-100)\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:30px;line-height:1;color:var(--capital-red)\">01<\u002Fspan>\n          <span><span style=\"display:block;font-family:var(--font-display);font-weight:300;font-size:23px;line-height:1.15;color:#000\">Operating leverage<\u002Fspan><span style=\"display:block;font-family:Arial,sans-serif;font-size:16px;line-height:1.4;color:var(--grey-800);margin-top:5px\"><span class=\"rv\">Miners geared to the price<span class=\"rv-card\">A copper producer’s margin expands faster than the metal price, so the equity captures more of the move than a metal wrapper.<\u002Fspan><\u002Fspan><\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div data-rv=\"\" style=\"animation-delay:0.19s;display:grid;grid-template-columns:46px 1fr;gap:16px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--grey-100)\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:30px;line-height:1;color:var(--capital-red)\">02<\u002Fspan>\n          <span><span style=\"display:block;font-family:var(--font-display);font-weight:300;font-size:23px;line-height:1.15;color:#000\">It pays something<\u002Fspan><span style=\"display:block;font-family:Arial,sans-serif;font-size:16px;line-height:1.4;color:var(--grey-800);margin-top:5px\"><span class=\"rv\">~1.5% distributed<span class=\"rv-card\">Unlike a metal ETC, producers distribute cash. The only leg of the basket that generates income while it waits.<\u002Fspan><\u002Fspan><\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div data-rv=\"\" style=\"animation-delay:0.28s;display:grid;grid-template-columns:46px 1fr;gap:16px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--grey-100)\">\n          <span style=\"font-family:var(--font-display);font-weight:300;font-style:italic;font-size:30px;line-height:1;color:var(--capital-red)\">03<\u002Fspan>\n          <span><span style=\"display:block;font-family:var(--font-display);font-weight:300;font-size:23px;line-height:1.15;color:#000\">Selection matters<\u002Fspan><span style=\"display:block;font-family:Arial,sans-serif;font-size:16px;line-height:1.4;color:var(--grey-800);margin-top:5px\"><span class=\"rv\">Grade and jurisdiction<span class=\"rv-card\">Ore grade and political risk vary enormously between producers. This is where active mining specialists earn their fee.<\u002Fspan><\u002Fspan><\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:var(--beige-100);padding:12px 20px 14px;margin-top:10px\">\n          <div style=\"font-family:var(--font-label);font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--capital-red)\">Its role in the basket<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:11px\">\n            <div><div style=\"font-family:var(--font-label);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--grey-800)\">Income<\u002Fdiv><div style=\"font-family:var(--font-display);font-weight:300;font-size:22px;line-height:1.1;margin-top:5px;color:#000\">~1.5%<\u002Fdiv><div style=\"font-family:Arial,sans-serif;font-size:14px;line-height:1.4;color:var(--grey-800);margin-top:6px\">The only leg that distributes cash<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-family:var(--font-label);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--grey-800)\">Volatility<\u002Fdiv><div style=\"font-family:var(--font-display);font-weight:300;font-size:22px;line-height:1.1;margin-top:5px;color:#000\">~30% annualised<\u002Fdiv><div style=\"font-family:Arial,sans-serif;font-size:14px;line-height:1.4;color:var(--grey-800);margin-top:6px\">Above the metal; equity beta is the trade-off<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-family:var(--font-label);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--grey-800)\">Liquidity<\u002Fdiv><div style=\"font-family:var(--font-display);font-weight:300;font-size:22px;line-height:1.1;margin-top:5px;color:#000\">Daily NAV<\u002Fdiv><div style=\"font-family:Arial,sans-serif;font-size:14px;line-height:1.4;color:var(--grey-800);margin-top:6px\">Fund dealing, not intraday exchange<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:20px;margin-top:12px;border-top:1px solid var(--grey-200);padding-top:11px\">\n          <span style=\"font-family:var(--font-label);font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--capital-red);white-space:nowrap\">Fallback<\u002Fspan>\n          <span style=\"font-family:Arial,sans-serif;font-size:17px;line-height:1.45;color:var(--grey-800)\"><span class=\"rv\">A metal ETC if equity beta becomes unwelcome<span class=\"rv-card\">A physical copper ETC opens the same electrification exposure without equity-market beta - at the cost of the dividend and the operating leverage.<\u002Fspan><\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"25 Appendix - bitcoin\" data-sp u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"29 Back cover\" style=\"width:1920px;height:1080px;overflow:hidden;box-sizing:border-box;background:var(--deep-red);color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center\">\n  <img src=\"e0ad9ade-68b1-416e-9811-ccebd51935fb\" alt=\"Cape Capital\" style=\"width:240px;height:auto\">\n  <div style=\"position:absolute;bottom:80px;left:0;right:0;text-align:center;font-family:Arial,sans-serif;font-size:16px;letter-spacing:0.6em;text-transform:uppercase;color:#fff\">Capecapital.com<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080},&quot;animateOnEntry&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Deck behaviour&quot;},&quot;showSources&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Deck behaviour&quot;}}\">\nclass Component extends DCLogic {\n  _flags() {\n    const r = document.documentElement.classList;\n    r.toggle('no-anim', this.props.animateOnEntry === false);\n    r.toggle('no-cites', this.props.showSources === false);\n  }\n  componentDidUpdate() { this._flags(); }\n  componentDidMount() {\n    this._open = new Set();\n    this._flags();\n    /* The stage renders slides through its shadow DOM, so every light-DOM\n       section reports an identical rect. Drive the reveal off the stage's own\n       current index (falling back to the 1-based location.hash it keeps in\n       sync), and only arm the hidden initial state once that resolves - a\n       slide that is never marked live must never be blank. */\n    /* Build the reveal sequence for a slide: header parts first (rule, eyebrow,\n       headline, lede), then each body block's rows/cards, then the closing bar.\n       Doing it here rather than in markup means every slide gets the same\n       staggered cadence as the Diversified Income deck without hand-tagging\n       hundreds of elements. */\n    this._prep = (sec) => {\n      if (sec.dataset.rvPrepped) return;\n      sec.dataset.rvPrepped = '1';\n      const kids = Array.prototype.slice.call(sec.children);\n      const pad = kids.filter(function (c) {\n        return c.tagName === 'DIV' && /height:\\s*100%/.test(c.getAttribute('style') || '');\n      })[0] || sec;\n      const seq = [];\n      // Chrome (logo, slide number, source line) is absolutely positioned and\n      // stays static per the template convention - sequence only the pad.\n      const blocks = Array.prototype.slice.call(pad.children).filter(function (c) {\n        if (c.classList.contains('rv-rail') || c.classList.contains('details-toggle')) return false;\n        return getComputedStyle(c).position !== 'absolute';\n      });\n      blocks.forEach(function (blk, bi) {\n        const rows = Array.prototype.slice.call(blk.children);\n        // Header block and small row groups reveal per child; dense grids and\n        // single-element blocks reveal as one unit.\n        if (rows.length > 1 && rows.length <= 16 && (bi === 0 || blk.offsetHeight > 90)) {\n          rows.forEach(function (r) { seq.push(r); });\n        } else {\n          seq.push(blk);\n        }\n      });\n      let d = 0.04;\n      seq.forEach(function (el) {\n        if (!el || el.nodeType !== 1) return;\n        el.setAttribute('data-rv', '');\n        el.style.animationDelay = d.toFixed(2) + 's';\n        d += 0.065;\n      });\n      // Second-order detail: nested rows inside a revealed grid get their own\n      // short offset so tables cascade rather than appearing as one plate.\n      seq.forEach(function (el, i) {\n        const inner = el.querySelectorAll(':scope > div > div[style*=\"border-bottom\"], :scope > tr');\n        if (inner.length > 2 && inner.length <= 16) {\n          Array.prototype.forEach.call(inner, function (r, j) {\n            r.setAttribute('data-rv', '');\n            r.style.animationDelay = (0.04 + i * 0.065 + j * 0.045).toFixed(2) + 's';\n          });\n        }\n      });\n    };\n    /* Reveal-on-hover: give each slide with key words a details toggle, and\n       build the ordered panel that shows every detail at once. */\n    this._rv = (sec) => {\n      const terms = Array.prototype.slice.call(sec.querySelectorAll('.rv'));\n      if (!terms.length || sec.dataset.rvBuilt) return;\n      sec.dataset.rvBuilt = '1';\n      const pad = Array.prototype.slice.call(sec.children).filter(function (c) {\n        return c.tagName === 'DIV' && /height:\\s*100%/.test(c.getAttribute('style') || '');\n      })[0];\n      if (pad) pad.setAttribute('data-rv-dim', '');\n\n      const btn = document.createElement('button');\n      btn.className = 'details-toggle';\n      btn.type = 'button';\n      btn.innerHTML = '<span class=\"dot\"><\u002Fspan><span>Details<\u002Fspan>';\n      sec.appendChild(btn);\n\n      const rail = document.createElement('div');\n      rail.className = 'rv-rail' +\n        (terms.length > 6 ? ' dense dense2' : terms.length > 3 ? ' dense' : '');\n      const head = document.createElement('div');\n      head.className = 'rv-rail-head';\n      head.textContent = 'Details · ' + (sec.dataset.screenLabel || '').replace(/^\\d+\\s*/, '');\n      rail.appendChild(head);\n\n      terms.forEach(function (term, i) {\n        const card = term.querySelector('.rv-card');\n        if (!card) return;\n        const detail = card.textContent.trim();\n        const key = term.textContent.replace(detail, '').trim().replace(/[\\s,.;:]+$/, '');\n        // The superscript index on the key word matches its rail number.\n        term.setAttribute('data-n', String(i + 1).padStart(2, '0'));\n        const item = document.createElement('div');\n        item.className = 'rv-item';\n        const n = document.createElement('span');\n        n.className = 'ri-n';\n        n.textContent = String(i + 1).padStart(2, '0');\n        const body = document.createElement('div');\n        const k = document.createElement('span');\n        k.className = 'ri-k';\n        k.textContent = key;\n        const d = document.createElement('span');\n        d.className = 'ri-d';\n        d.textContent = detail;\n        body.appendChild(k);\n        body.appendChild(d);\n        item.appendChild(n);\n        item.appendChild(body);\n        const lit = function (on) { term.classList.toggle('lit', on); item.classList.toggle('hot', on); };\n        item.addEventListener('mouseenter', function () { lit(true); });\n        item.addEventListener('mouseleave', function () { lit(false); });\n        term.addEventListener('mouseenter', function () { lit(true); });\n        term.addEventListener('mouseleave', function () { lit(false); });\n        rail.appendChild(item);\n      });\n      sec.appendChild(rail);\n      const self = this;\n      btn.addEventListener('click', function (e) {\n        e.stopPropagation();\n        // State lives in the component, not the class list - a template\n        // re-render reconciles className and would drop it.\n        if (self._open.has(sec)) self._open.delete(sec); else self._open.add(sec);\n        sec.classList.toggle('details-on', self._open.has(sec));\n      });\n    };\n    /* Keep each hover card inside the slide. */\n    this._place = () => {\n      document.querySelectorAll('deck-stage > section').forEach(function (s) {\n        const sr = s.getBoundingClientRect();\n        const k = sr.width / 1920 || 1;\n        s.querySelectorAll('.rv').forEach(function (term) {\n          const card = term.querySelector('.rv-card');\n          if (!card) return;\n          card.classList.remove('up', 'shift');\n          const t = term.getBoundingClientRect();\n          const h = card.offsetHeight * k || 130 * k;\n          if (t.bottom + 12 * k + h > sr.bottom - 40 * k) card.classList.add('up');\n          if (t.left + 330 * k > sr.right - 48 * k) card.classList.add('shift');\n        });\n      });\n    };\n    this._onKey = (e) => {\n      if (e.key !== 'd' && e.key !== 'D') return;\n      if (e.target && /input|textarea/i.test(e.target.tagName || '')) return;\n      const live = document.querySelector('deck-stage > section.is-live');\n      const b = live && live.querySelector('.details-toggle');\n      if (b) b.click();\n    };\n    document.addEventListener('keydown', this._onKey);\n    this._live = () => {\n      const stage = document.querySelector('deck-stage');\n      const secs = Array.prototype.slice.call(document.querySelectorAll('deck-stage > section'));\n      if (!stage || !secs.length) return;\n      let i = typeof stage.index === 'number' ? stage.index : -1;\n      if (i < 0) {\n        const h = (location.hash || '').match(/^#(\\d+)$/);\n        i = h ? parseInt(h[1], 10) - 1 : 0;\n      }\n      if (i < 0 || i >= secs.length) i = 0;\n      secs.forEach(this._prep);\n      secs.forEach(this._rv);\n      document.documentElement.classList.add('rv-armed');\n      secs.forEach((s, n) => {\n        if (n === i) {\n          if (!s.classList.contains('is-live')) s.classList.add('is-live');\n          s.classList.toggle('details-on', this._open.has(s));\n        } else {\n          s.classList.remove('is-live');\n          s.classList.remove('details-on');\n          this._open.delete(s);\n        }\n      });\n      this._place();\n    };\n    this._tick = () => { clearTimeout(this._t); this._t = setTimeout(this._live, 60); };\n    this._onMsg = (e) => { if (e && e.data && e.data.slideIndexChanged != null) this._tick(); };\n    document.addEventListener('keyup', this._tick);\n    document.addEventListener('click', this._tick);\n    window.addEventListener('hashchange', this._tick);\n    window.addEventListener('message', this._onMsg);\n    this._iv = setInterval(this._live, 260);\n    setTimeout(this._live, 300);\n  }\n  componentWillUnmount() {\n    clearInterval(this._iv);\n    document.removeEventListener('keyup', this._tick);\n    document.removeEventListener('click', this._tick);\n    window.removeEventListener('hashchange', this._tick);\n    window.removeEventListener('message', this._onMsg);\n  }\n  renderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
